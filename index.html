<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0,user-scalable=no,maximum-scale=1.0"
>

<title>감자키우기</title>

<style>

/* ==================================================
   기본
================================================== */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;
    user-select:none;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#f8f3e8;
    color:#3d2c1e;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Apple SD Gothic Neo",
        "Noto Sans KR",
        sans-serif;
}

body{
    overflow-x:hidden;
}

button{
    border:0;
    font:inherit;
    cursor:pointer;
}

.screen{
    display:none;
    min-height:100vh;
    padding:25px 18px 40px;
}

.screen.active{
    display:block;
}


/* ==================================================
   시작
================================================== */

#startScreen{
    min-height:100vh;

    display:none;

    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    background:
        linear-gradient(
            180deg,
            #fff9ed,
            #f3ead7
        );
}

#startScreen.active{
    display:flex;
}

.startPotato{
    font-size:76px;
    margin-bottom:10px;
}

.startTitle{
    font-size:34px;
    font-weight:900;
    margin-bottom:8px;
}

.startSub{
    font-size:14px;
    color:#8b7764;
    margin-bottom:35px;
}

.startButton{
    width:210px;
    padding:17px 20px;

    border-radius:18px;

    background:#9b6b43;
    color:white;

    font-size:18px;
    font-weight:800;

    box-shadow:
        0 6px 0 #70482b;
}

.startButton:active{
    transform:translateY(4px);
    box-shadow:
        0 2px 0 #70482b;
}


/* ==================================================
   공통
================================================== */

.topBar{
    max-width:600px;
    margin:0 auto 18px;

    display:flex;
    justify-content:space-between;
    align-items:center;
}

.pageTitle{
    font-size:24px;
    font-weight:900;
}

.backButton{
    padding:9px 13px;
    border-radius:12px;
    background:#eadbc7;
    color:#5d4632;
    font-weight:700;
}

.card{
    max-width:600px;
    margin:0 auto 16px;

    padding:18px;

    background:white;

    border-radius:20px;

    box-shadow:
        0 5px 18px rgba(78,51,28,.08);
}


/* ==================================================
   성장 화면
================================================== */

.growthCard{
    text-align:center;
}

.growthStage{
    font-size:18px;
    font-weight:800;
    margin-bottom:15px;
}

.growthPlant{
    height:230px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:110px;
}

.growthNumber{
    font-size:32px;
    font-weight:900;
}

.progress{
    width:100%;
    height:18px;

    background:#eadfce;

    border-radius:20px;

    overflow:hidden;

    margin:15px 0;
}

.progressBar{
    height:100%;
    width:0%;

    background:#82ad5c;

    border-radius:20px;

    transition:width .2s;
}

.growButton{
    width:100%;
    padding:17px;

    border-radius:16px;

    background:#82ad5c;
    color:white;

    font-weight:900;
    font-size:17px;
}


/* ==================================================
   감자
================================================== */

.potatoImage{
    width:180px;
    height:180px;

    margin:0 auto 12px;

    background-position:center;
    background-repeat:no-repeat;
    background-size:contain;
}

.potatoName{
    text-align:center;

    font-size:28px;
    font-weight:900;
}

.personality{
    margin-top:6px;

    text-align:center;

    color:#806d5b;
    font-size:14px;
    line-height:1.6;
}

.stats{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-top:18px;
}

.stat{
    padding:12px;

    border-radius:14px;

    background:#f7f1e8;
}

.statName{
    font-size:12px;
    color:#8c7966;
}

.statValue{
    margin-top:3px;

    font-size:20px;
    font-weight:900;
}

.actionGrid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.actionButton{
    padding:15px 8px;

    border-radius:15px;

    background:#eadbc7;

    color:#4f3928;

    font-weight:800;
}

.actionButton:active{
    transform:scale(.97);
}

.actionButton.danger{
    background:#e8b7aa;
}

.dialogue{
    min-height:54px;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:12px;

    border-radius:14px;

    background:#f8f1e6;

    text-align:center;

    line-height:1.5;

    font-weight:700;
}


/* ==================================================
   다마고치
================================================== */

.tama{
    position:relative;

    width:100%;
    max-width:600px;

    height:460px;

    margin:0 auto;

    overflow:hidden;

    border-radius:25px;

    background:
        linear-gradient(
            180deg,
            #d9f1fa 0%,
            #e8f7fb 68%,
            #c8a57d 68%,
            #b78f68 100%
        );

    box-shadow:
        inset 0 0 0 3px rgba(255,255,255,.5),
        0 8px 25px rgba(55,39,24,.12);
}

.tamaPotato{
    position:absolute;

    width:58px;
    height:58px;

    background-position:center;
    background-size:contain;
    background-repeat:no-repeat;

    z-index:10;

    transition:
        left .35s linear,
        top .35s linear;

    filter:
        drop-shadow(
            0 3px 3px
            rgba(0,0,0,.12)
        );
}

.tamaSpeech{
    position:absolute;

    transform:
        translate(-50%,-100%);

    padding:7px 10px;

    border-radius:12px;

    background:white;

    color:#443126;

    font-size:11px;
    font-weight:800;

    white-space:nowrap;

    box-shadow:
        0 3px 10px rgba(0,0,0,.12);

    z-index:30;

    pointer-events:none;
}

.boriCat{
    position:absolute;

    width:48px;
    height:48px;

    display:none;

    align-items:center;
    justify-content:center;

    font-size:40px;
    line-height:1;

    pointer-events:none;

    z-index:25;

    filter:
        drop-shadow(
            0 3px 3px
            rgba(0,0,0,.14)
        );

    transition:
        left .35s ease,
        top .35s ease;
}


/* ==================================================
   도감
================================================== */

.dictionaryGrid{
    max-width:600px;
    margin:0 auto;

    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:12px;
}

.dictionaryItem{
    padding:14px;

    background:white;

    border-radius:18px;

    box-shadow:
        0 4px 15px rgba(78,51,28,.07);

    text-align:center;
}

.dictionaryImage{
    width:100px;
    height:100px;

    margin:0 auto 7px;

    background-position:center;
    background-repeat:no-repeat;
    background-size:contain;
}

.dictionaryName{
    font-size:16px;
    font-weight:900;
}

.dictionaryButton{
    width:100%;

    margin-top:10px;

    padding:10px;

    border-radius:12px;

    background:#e5d5c1;

    font-size:13px;
    font-weight:800;
}

.dictionaryButton.active{
    background:#8eaf6b;
    color:white;
}


/* ==================================================
   수확
================================================== */

.harvestCard{
    text-align:center;
}

.harvestButton{
    width:100%;

    padding:17px;

    border-radius:16px;

    background:#a56f43;

    color:white;

    font-weight:900;
}


/* ==================================================
   하단 메뉴
================================================== */

.bottomMenu{
    max-width:600px;

    margin:20px auto 0;

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:10px;
}

.menuButton{
    padding:15px;

    border-radius:15px;

    background:#e7d8c4;

    font-weight:800;
}


/* ==================================================
   반응형
================================================== */

@media(max-width:420px){

    .screen{
        padding-left:14px;
        padding-right:14px;
    }

    .tama{
        height:430px;
    }

    .tamaPotato{
        width:54px;
        height:54px;
    }

    .dictionaryGrid{
        gap:9px;
    }

    .dictionaryImage{
        width:82px;
        height:82px;
    }

}

</style>

</head>


<body>


<!-- ==================================================
     시작
================================================== -->

<section
    id="startScreen"
    class="screen active"
>

    <div class="startPotato">
        🌱
    </div>

    <div class="startTitle">
        감자키우기
    </div>

    <div class="startSub">
        나만의 감자를 키워보세요
    </div>

    <button
        class="startButton"
        onclick="startGame()"
    >
        시작
    </button>

</section>


<!-- ==================================================
     성장
================================================== -->

<section
    id="growScreen"
    class="screen"
>

    <div class="topBar">

        <div class="pageTitle">
            감자 키우기
        </div>

    </div>


    <div class="card growthCard">

        <div
            id="growthStage"
            class="growthStage"
        >
            싹
        </div>

        <div
            id="growthPlant"
            class="growthPlant"
        >
            🌱
        </div>

        <div
            id="growthNumber"
            class="growthNumber"
        >
            0%
        </div>

        <div class="progress">

            <div
                id="progressBar"
                class="progressBar"
            ></div>

        </div>

        <button
            class="growButton"
            onclick="growAction()"
        >
            🌱 키우기
        </button>

    </div>


    <div class="card">

        <div
            id="growDialogue"
            class="dialogue"
        >
            감자를 키워보자!
        </div>

    </div>

</section>


<!-- ==================================================
     감자
================================================== -->

<section
    id="petScreen"
    class="screen"
>

    <div class="topBar">

        <div class="pageTitle">
            감자
        </div>

    </div>


    <div class="card">

        <div
            id="petImage"
            class="potatoImage"
        ></div>

        <div
            id="petName"
            class="potatoName"
        ></div>

        <div
            id="petPersonality"
            class="personality"
        ></div>


        <div
            id="petDialogue"
            class="dialogue"
        >
            안녕!
        </div>


        <div class="stats">

            <div class="stat">
                <div class="statName">
                    배고픔
                </div>

                <div
                    id="hungerValue"
                    class="statValue"
                >
                    0
                </div>
            </div>


            <div class="stat">
                <div class="statName">
                    수분
                </div>

                <div
                    id="waterValue"
                    class="statValue"
                >
                    0
                </div>
            </div>


            <div class="stat">
                <div class="statName">
                    호감도
                </div>

                <div
                    id="loveValue"
                    class="statValue"
                >
                    0
                </div>
            </div>


            <div class="stat">
                <div class="statName">
                    체력
                </div>

                <div
                    id="energyValue"
                    class="statValue"
                >
                    0
                </div>
            </div>

        </div>

    </div>


    <div class="card">

        <div class="actionGrid">

            <button
                class="actionButton"
                onclick="petAction('food')"
            >
                🍎 먹이
            </button>

            <button
                class="actionButton"
                onclick="petAction('water')"
            >
                💧 물
            </button>

            <button
                class="actionButton"
                onclick="petAction('pet')"
            >
                ❤️ 쓰다듬기
            </button>

            <button
                class="actionButton"
                onclick="petAction('walk')"
            >
                🚶 산책
            </button>

        </div>

    </div>


    <div class="bottomMenu">

        <button
            class="menuButton"
            onclick="openDictionary()"
        >
            📖 감자사전
        </button>

        <button
            class="menuButton"
            onclick="harvestPotato()"
        >
            🥔 수확
        </button>

    </div>

</section>


<!-- ==================================================
     감자사전
================================================== -->

<section
    id="dictionaryScreen"
    class="screen"
>

    <div class="topBar">

        <div class="pageTitle">
            감자사전
        </div>

        <button
            class="backButton"
            onclick="goBackFromDictionary()"
        >
            뒤로
        </button>

    </div>


    <div
        id="dictionaryGrid"
        class="dictionaryGrid"
    ></div>


    <div
        id="tama"
        class="tama"
        style="margin-top:20px;"
    >

        <div
            id="boriCat"
            class="boriCat"
        >
            🐈
        </div>

    </div>

</section>


<script>

/* ==================================================
   감자 데이터
================================================== */

const POTATOES=[

    {
        name:"꾼감자",

        image:"Potato1.PNG",

        style:"social",

        personality:
            "나긋하고 느긋하며 상대의 말을 잘 들어준다. 겉보기에는 순하고 무해하지만 상황을 세심하게 관찰한다.",

        favorite:"대화",

        lines:[
            "오늘도 평화롭네.",
            "같이 있으면 좋겠다.",
            "천천히 하자.",
            "뭐 하고 있었어?",
            "나는 구경하는 게 좋아.",
            "다들 사이좋게 지내자."
        ],

        catLines:[
            "보리 어디 갔지?",
            "보리 보고 싶다.",
            "보리야~",
            "오늘도 보리가 귀엽네.",
            "보리랑 놀고 싶다.",
            "보리가 또 숨어버렸어.",
            "보리 밥은 먹었나?"
        ]
    },


    {
        name:"대장감자",

        image:"Potato2.PNG",

        style:"leader",

        personality:
            "자신감이 넘치고 다른 감자들을 이끌려고 한다. 책임감이 강하고 주변을 챙긴다.",

        favorite:"칭찬",

        lines:[
            "내가 앞장설게.",
            "다들 따라와.",
            "걱정하지 마.",
            "내가 해결한다.",
            "질서를 지키자.",
            "좋아, 출발한다."
        ]
    },


    {
        name:"독감자",

        image:"Potato3.PNG",

        style:"toxic",

        personality:
            "혼자 있는 것을 좋아하고 가까이 오는 감자를 귀찮아한다. 예민하고 까칠하다.",

        favorite:"혼자 있기",

        lines:[
            "가까이 오지 마.",
            "귀찮아.",
            "혼자 있을래.",
            "왜 따라와?",
            "저리 가.",
            "조용히 좀 해."
        ]
    },


    {
        name:"폭력감자",

        image:"Potato4.PNG",

        style:"violent",

        personality:
            "성격이 거칠고 행동이 과격하다. 다른 감자들과 자주 충돌하지만 의외로 특정 감자를 따라다니기도 한다.",

        favorite:"싸움",

        lines:[
            "비켜.",
            "건드리지 마.",
            "나 지금 바빠.",
            "뭐야.",
            "따라갈 거야.",
            "가자."
        ]
    },


    {
        name:"저능감자",

        image:"Potato5.PNG",

        style:"dummy",

        personality:
            "생각보다 행동이 먼저 나간다. 단순하고 엉뚱하지만 미워할 수 없는 성격이다.",

        favorite:"간식",

        lines:[
            "뭐였지?",
            "배고파.",
            "어디 가?",
            "우와!",
            "나 뭐 하려고 했더라?",
            "감자다!"
        ]
    }

];


/* ==================================================
   게임 상태
================================================== */

const SAVE_KEY="potatoGameSave";


let game={

    growth:0,

    stage:0,

    day:1,

    potato:null,

    stats:{
        hunger:0,
        water:0,
        love:0,
        energy:0
    },

    discovered:[],

    tamaEnabled:{},

    tamaPotatoes:[],

    sleeping:false,

    leaderHeld:false,

    dialogueLock:false,

    dialogueUntil:0

};


/* ==================================================
   공통
================================================== */

function clamp(
    value,
    min=0,
    max=100
){

    return Math.max(
        min,
        Math.min(max,value)
    );

}


function random(array){

    return array[
        Math.floor(
            Math.random()*array.length
        )
    ];

}


function showScreen(id){

    document
        .querySelectorAll(".screen")
        .forEach(
            screen =>
                screen.classList.remove("active")
        );

    document
        .getElementById(id)
        .classList.add("active");

    window.scrollTo(0,0);

}


/* ==================================================
   시작
================================================== */

function startGame(){

    loadGame();

    showScreen(
        game.potato
            ? "petScreen"
            : "growScreen"
    );

    updateGrow();

    if(game.potato){
        updatePet();
    }

}


/* ==================================================
   성장
================================================== */

const GROW_STAGES=[

    {
        name:"싹",
        emoji:"🌱"
    },

    {
        name:"이파리",
        emoji:"🌿"
    },

    {
        name:"나무",
        emoji:"🌳"
    },

    {
        name:"감자",
        emoji:"🥔"
    }

];


function growAction(){

    if(game.growth>=100){

        createRandomPotato();

        return;
    }


    const amount =
        Math.floor(
            Math.random()*8
        )+4;


    game.growth=
        clamp(
            game.growth+amount
        );


    updateGrow();


    document
        .getElementById("growDialogue")
        .textContent=
            random([
                "쑥쑥 자라고 있어!",
                "조금만 더!",
                "감자가 자라는 중이야.",
                "물을 잘 줘보자.",
                "열심히 크고 있다!"
            ]);


    saveGame();


    if(game.growth>=100){

        setTimeout(
            createRandomPotato,
            500
        );

    }

}


function updateGrow(){

    const stageIndex =
        Math.min(
            3,
            Math.floor(
                game.growth/25
            )
        );


    game.stage=stageIndex;


    const stage =
        GROW_STAGES[stageIndex];


    document
        .getElementById("growthStage")
        .textContent=
            stage.name;


    document
        .getElementById("growthPlant")
        .textContent=
            stage.emoji;


    document
        .getElementById("growthNumber")
        .textContent=
            game.growth+"%";


    document
        .getElementById("progressBar")
        .style.width=
            game.growth+"%";

}


/* ==================================================
   감자 탄생
================================================== */

function createRandomPotato(){

    const potato=
        random(POTATOES);


    game.potato={
        name:potato.name,
        image:potato.image,
        style:potato.style,
        personality:potato.personality,
        favorite:potato.favorite,
        lines:potato.lines,
        catLines:potato.catLines || null
    };


    if(
        !game.discovered.includes(
            potato.name
        )
    ){

        game.discovered.push(
            potato.name
        );

    }


    game.stats={
        hunger:50,
        water:50,
        love:20,
        energy:70
    };


    game.growth=0;
    game.stage=0;


    updatePet();

    showScreen("petScreen");

    speak(
        "새로운 감자 "+potato.name+"가 태어났어!"
    );


    saveGame();

}


/* ==================================================
   감자 상호작용
================================================== */

function petAction(type){

    if(!game.potato){
        return;
    }


    const p=game.potato;


    if(type==="food"){

        game.stats.hunger=
            clamp(
                game.stats.hunger+20
            );

        game.stats.energy=
            clamp(
                game.stats.energy+5
            );

        speak(
            random(p.lines)+
            " 냠냠!"
        );

    }


    if(type==="water"){

        game.stats.water=
            clamp(
                game.stats.water+20
            );

        speak(
            random(p.lines)+
            " 물 맛있다."
        );

    }


    if(type==="pet"){

        game.stats.love=
            clamp(
                game.stats.love+10
            );

        speak(
            random([
                "기분 좋다.",
                "쓰다듬어줘서 좋아.",
                "조금 더 해줘.",
                "헤헤."
            ])
        );

    }


    if(type==="walk"){

        game.stats.energy=
            clamp(
                game.stats.energy-5
            );

        game.stats.love=
            clamp(
                game.stats.love+8
            );

        speak(
            random([
                "산책 가자!",
                "바람 좋다.",
                "같이 걷자.",

            ])
        );

    }

    saveGame();

}

function harvestPotato(){

    }


    const answer=
        window.confirm(
            `${game.potato.name}을(를) 수확할까요?\n\n수확하면 현재 감자와 성장 상태가 초기화됩니다.`

   도감

function openDictionary(){

    );

}


function goBackFromDictionary(){

    if(game.potato){

function renderDictionary(){

    const grid=
        document.getElementById(
            "dictionaryGrid"
        );


    grid.innerHTML="";


    POTATOES.forEach(
        potato => {

            const discovered=
                game.discovered.includes(
                    potato.name
                );


            const item=
                document.createElement(
                    "div"
                );


            item.className=
                "dictionaryItem";


            const image=
                document.createElement(
                    "div"
                );

                "dictionaryImage";


            image.style.backgroundImage=
                `url("${potato.image}")`;


            const name=
                document.createElement(
                    "div"
                );


            name.className=

            name.textContent=

                    ? potato.name
                    : "???";

                document.createElement(
                    "button"
                );

                ]
            ){

                );

            }

            button.onclick=

                    }


                    game.tamaEnabled[
                        potato.name
                    ]=

                            potato.name
                        ];


                    renderDictionary();

                    renderTama();

                    saveGame();

                };


            item.appendChild(image);

            item.appendChild(name);

            item.appendChild(button);


            grid.appendChild(item);

        }
    );


    renderTama();

}


/* ==================================================
   다마고치 생성
================================================== */

function createTamaPotato(
    data,
    index
){

    const room=
        document.getElementById(
            "tama"
        );


    const el=
        document.createElement(
            "div"
        );


    el.className=
        "tamaPotato";


    el.style.backgroundImage=
        `url("${data.image}")`;


    const obj={

        data:data,

        x:
            30+
            Math.random()*
            Math.max(
                50,
                room.clientWidth-100
            ),

        y:
            55+
            Math.random()*30,

        targetX:0,

        targetY:0,

        followingToxic:false,

        followStart:0,

        speechEl:null,

        sleeping:false,

        dragging:false

    };


    obj.targetX=obj.x;
    obj.targetY=obj.y;


    el.addEventListener(
        "pointerdown",
        function(e){

            obj.dragging=true;

            el.setPointerCapture(
                e.pointerId
            );

        }
    );


    el.addEventListener(
        "pointermove",
        function(e){

            if(!obj.dragging){
                return;
            }


            const rect=
                room.getBoundingClientRect();


            obj.x=
                e.clientX-
                rect.left-
                29;


            obj.y=
                (
                    (
                        e.clientY-
                        rect.top-
                        29
                    )
                    /
                    room.clientHeight
                )*100;


            obj.x=
                clampTamaX(
                    obj.x
                );


            obj.y=
                clampTamaY(
                    obj.y
                );


            updateTamaElement(
                obj,
                el
            );

        }
    );


    el.addEventListener(
        "pointerup",
        function(){

            obj.dragging=false;

        }
    );


    room.appendChild(el);


    obj.element=el;


    game.tamaPotatoes.push(
        obj
    );


    return obj;

}


/* ==================================================
   다마고치 렌더
================================================== */

function renderTama(){

    const room=
        document.getElementById(
            "tama"
        );


    if(!room){
        return;
    }


    room
        .querySelectorAll(
            ".tamaPotato"
        )
        .forEach(
            el => el.remove()
        );


    game.tamaPotatoes=[];


    const active=
        POTATOES.filter(
            potato =>
                game.tamaEnabled[
                    potato.name
                ]
        );


    active.forEach(
        (data,index) => {

            createTamaPotato(
                data,
                index
            );

        }
    );


    /*
       꾼감자가 없으면
       보리도 즉시 제거
    */

    if(
        !active.some(
            p =>
                p.name==="꾼감자"
        )
    ){

        hideBori();

    }

}


/* ==================================================
   다마고치 위치
================================================== */

function clampTamaX(x){

    const room=
        document.getElementById(
            "tama"
        );


    if(!room){
        return x;
    }


    return Math.max(
        5,
        Math.min(
            room.clientWidth-63,
            x
        )
    );

}


function clampTamaY(y){

    return Math.max(
        45,
        Math.min(
            88,
            y
        )
    );

}


function updateTamaElement(
    obj,
    el
){

    if(!el){
        return;
    }


    el.style.left=
        obj.x+"px";


    el.style.top=
        obj.y+"%";

}


/* ==================================================
   랜덤 목표
================================================== */

function randomTamaTarget(obj){

    const room=
        document.getElementById(
            "tama"
        );


    if(!room){
        return;
    }


    obj.targetX=
        10+
        Math.random()*
        Math.max(
            30,
            room.clientWidth-85
        );


    obj.targetY=
        52+
        Math.random()*34;

}


/* ==================================================
   폭력감자 → 독감자
================================================== */

function updateViolentBehavior(){

    const violent=
        game.tamaPotatoes.find(
            p =>
                p.data.style==="violent"
        );


    const toxic=
        game.tamaPotatoes.find(
            p =>
                p.data.style==="toxic"
        );


    if(!violent){
        return;
    }


    /*
       독감자가 없으면
       독립 행동
    */

    if(!toxic){

        violent.followingToxic=false;

        violent.followStart=0;

        return;

    }


    const dx=
        toxic.x-
        violent.x;


    const dy=
        toxic.y-
        violent.y;


    const distance=
        Math.sqrt(
            dx*dx+
            dy*dy
        );


    /*
       너무 멀리 떨어져 있으면
       일정 확률로 따라가기 시작
    */

    if(
        !violent.followingToxic &&
        distance>75 &&
        Math.random()<0.025
    ){

        violent.followingToxic=true;

        violent.followStart=
            performance.now();

    }


    if(
        violent.followingToxic
    ){

        const elapsed=
            performance.now()-
            violent.followStart;


        /*
           10초가 지나면
           독립 행동으로 복귀
        */

        if(
            elapsed>=10000
        ){

            violent.followingToxic=false;

            violent.followStart=0;

            randomTamaTarget(
                violent
            );

            return;

        }


        /*
           독감자 옆으로 이동
           같은 위치로 이동하지 않음
        */

        const side=
            violent.x<
            toxic.x
                ? -48
                : 48;


        violent.targetX=
            clampTamaX(
                toxic.x+side
            );


        violent.targetY=
            clampTamaY(
                toxic.y+3
            );

    }

}


/* ==================================================
   폭력감자 / 독감자 겹침 방지
================================================== */

function preventToxicViolentOverlap(){

    const violent=
        game.tamaPotatoes.find(
            p =>
                p.data.style==="violent"
        );


    const toxic=
        game.tamaPotatoes.find(
            p =>
                p.data.style==="toxic"
        );


    if(
        !violent ||
        !toxic
    ){
        return;
    }


    const dx=
        violent.x-
        toxic.x;


    const dy=
        violent.y-
        toxic.y;


    const distance=
        Math.sqrt(
            dx*dx+
            dy*dy
        );


    const minDistance=42;


    if(
        distance>0 &&
        distance<minDistance
    ){

        const push=
            minDistance-
            distance;


        violent.x +=
            dx/distance*
            push;


        violent.y +=
            dy/distance*
            push;


        violent.x=
            clampTamaX(
                violent.x
            );


        violent.y=
            clampTamaY(
                violent.y
            );

    }

}


/* ==================================================
   꾼감자 고양이 보리
================================================== */

let boriTimer=null;


/*
   꾼감자가 실제로 다마고치에 있는지
*/

function hasKkung(){

    return game.tamaPotatoes.some(
        p =>
            p.data &&
            p.data.name==="꾼감자"
    );

}


/*
   보리 등장
*/

function showBori(){

    const room=
        document.getElementById(
            "tama"
        );


    const bori=
        document.getElementById(
            "boriCat"
        );


    if(
        !room ||
        !bori
    ){
        return;
    }


    /*
       꾼감자가 없으면
       절대 등장하지 않음
    */

    if(!hasKkung()){

        hideBori();

        return;

    }


    const kkung=
        game.tamaPotatoes.find(
            p =>
                p.data.name==="꾼감자"
        );


    if(!kkung){
        return;
    }


    if(boriTimer){

        clearTimeout(
            boriTimer
        );

    }


    /*
       꾼감자 옆에 등장
    */

    let x=
        kkung.x+
        (
            Math.random()<.5
                ? -55
                : 55
        );


    let y=
        kkung.y+2;


    x=
        Math.max(
            5,
            Math.min(
                room.clientWidth-53,
                x
            )
        );


    y=
        Math.max(
            45,
            Math.min(
                88,
                y
            )
        );


    bori.style.left=
        x+"px";


    bori.style.top=
        y+"%";


    bori.style.display=
        "flex";


    /*
       5초 후 사라짐
    */

    boriTimer=
        setTimeout(
            hideBori,
            5000
        );

}


/*
   보리 사라짐
*/

function hideBori(){

    const bori=
        document.getElementById(
            "boriCat"
        );


    if(!bori){
        return;
    }


    bori.style.display=
        "none";


    if(boriTimer){

        clearTimeout(
            boriTimer
        );

        boriTimer=null;

    }

}


/* ==================================================
   꾼감자 고양이 대사
================================================== */

function tryKkungCatDialogue(){

    if(!hasKkung()){
        return false;
    }


    const kkung=
        game.tamaPotatoes.find(
            p =>
                p.data.name==="꾼감자"
        );


    if(
        !kkung ||
        !kkung.data.catLines
    ){
        return false;
    }


    /*
       일반 대사 중
       일정 확률로 보리 관련 대사
    */

    if(
        Math.random()<0.12
    ){

        const line=
            random(
                kkung.data.catLines
            );


        showTamaSpeech(
            kkung,
            line
        );


        showBori();


        return true;

    }


    return false;

}


/* ==================================================
   다마고치 말풍선
================================================== */

function showTamaSpeech(
    obj,
    text
){

    if(
        obj.speechEl
    ){

        obj.speechEl.remove();

    }


    const room=
        document.getElementById(
            "tama"
        );


    if(!room){
        return;
    }


    const speech=
        document.createElement(
            "div"
        );


    speech.className=
        "tamaSpeech";


    speech.textContent=
        text;


    room.appendChild(
        speech
    );


    obj.speechEl=
        speech;


    function position(){

        speech.style.left=
            (
                obj.x+29
            )+"px";


        speech.style.top=
            (
                obj.y
            )+"%";

    }


    position();


    setTimeout(
        function(){

            if(
                speech &&
                speech.parentNode
            ){

                speech.remove();

            }

            if(
                obj.speechEl===
                speech
            ){

                obj.speechEl=null;

            }

        },
        2200
    );

}


/* ==================================================
   일반 랜덤 대사
================================================== */

function randomTamaDialogue(){

    if(
        game.tamaPotatoes.length===0
    ){
        return;
    }


    /*
       꾼감자 보리 이벤트를
       먼저 확인
    */

    if(
        tryKkungCatDialogue()
    ){

        return;

    }


    const obj=
        random(
            game.tamaPotatoes
        );


    if(
        !obj ||
        !obj.data.lines
    ){
        return;
    }


    showTamaSpeech(
        obj,
        random(
            obj.data.lines
        )
    );

}


/* ==================================================
   다마고치 이동
================================================== */

function updateTamaMovement(){

    game.tamaPotatoes.forEach(
        obj => {

            if(
                obj.dragging
            ){
                return;
            }


            /*
               목표까지 이동
            */

            const dx=
                obj.targetX-
                obj.x;


            const dy=
                obj.targetY-
                obj.y;


            const distance=
                Math.sqrt(
                    dx*dx+
                    dy*dy
                );


            if(
                distance<2
            ){

                /*
                   폭력감자가
                   독감자를 따라가는 중이면
                   목표를 다시 계산
                */

                if(
                    obj.data.style!=="violent" ||
                    !obj.followingToxic
                ){

                    randomTamaTarget(
                        obj
                    );

                }

            }else{

                const speed=
                    obj.data.style==="dummy"
                        ? .22
                        : .32;


                obj.x +=
                    dx/distance*
                    speed;


                obj.y +=
                    dy/distance*
                    speed;

            }


            obj.x=
                clampTamaX(
                    obj.x
                );


            obj.y=
                clampTamaY(
                    obj.y
                );


            updateTamaElement(
                obj,
                obj.element
            );


            if(
                obj.speechEl
            ){

                obj.speechEl.style.left=
                    (
                        obj.x+29
                    )+"px";


                obj.speechEl.style.top=
                    obj.y+"%";

            }

        }
    );

}


/* ==================================================
   다마고치 루프
================================================== */

let tamaLoopStarted=false;


function startTamaLoop(){

    if(tamaLoopStarted){
        return;
    }


    tamaLoopStarted=true;


    let lastDialogue=
        performance.now();


    function loop(){

        updateViolentBehavior();

        updateTamaMovement();

        preventToxicViolentOverlap();


        const now=
            performance.now();


        /*
           랜덤 대사
        */

        if(
            now-lastDialogue>
            4000+
            Math.random()*5000
        ){

            randomTamaDialogue();

            lastDialogue=now;

        }


        /*
           꾼감자가 사라졌다면
           보리도 즉시 제거
        */

        if(!hasKkung()){

            hideBori();

        }


        requestAnimationFrame(
            loop
        );

    }


    requestAnimationFrame(
        loop
    );

}


/* ==================================================
   저장
================================================== */

function saveGame(){

    try{

        const saveData={

            growth:
                game.growth,

            stage:
                game.stage,

            day:
                game.day,

            potato:
                game.potato,

            stats:
                game.stats,

            discovered:
                game.discovered,

            tamaEnabled:
                game.tamaEnabled,

            sleeping:
                game.sleeping

        };


        localStorage.setItem(
            SAVE_KEY,
            JSON.stringify(
                saveData
            )
        );


    }catch(error){

        console.log(
            "게임 저장 실패:",
            error
        );

    }

}


/* ==================================================
   불러오기
================================================== */

function loadGame(){

    const saved=
        localStorage.getItem(
            SAVE_KEY
        );


    if(!saved){
        return;
    }


    try{

        const data=
            JSON.parse(
                saved
            );


        game.growth=
            data.growth ??
            0;


        game.stage=
            data.stage ??
            0;


        game.day=
            data.day ??
            1;


        game.potato=
            data.potato ??
            null;


        game.stats=
            data.stats ||
            {
                hunger:0,
                water:0,
                love:0,
                energy:0
            };


        game.discovered=
            data.discovered ||
            [];


        game.tamaEnabled=
            data.tamaEnabled ||
            {};


        game.sleeping=
            data.sleeping ??
            false;


        updateGrow();


        if(game.potato){

            updatePet();

        }


    }catch(error){

        console.log(
            "저장 데이터 불러오기 실패:",
            error
        );

    }

}


/* ==================================================
   자동 저장
================================================== */

setInterval(
    saveGame,
    3000
);


/* ==================================================
   시작 초기화
================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        loadGame();

        updateGrow();

        startTamaLoop();

    }
);

</script>
