<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0,user-scalable=no,maximum-scale=1.0"
>

<title>감자키우기</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#f3ead7;
    font-family:
        "Apple SD Gothic Neo",
        "Noto Sans KR",
        sans-serif;
    overflow-x:hidden;
}

body{
    overscroll-behavior-x:none;
}

button{
    font-family:inherit;
    border:0;
    cursor:pointer;
}

button:active{
    transform:scale(.94);
}

#app{
    width:100%;
    min-height:100vh;
}

.screen{
    width:100%;
    min-height:100vh;
}

.hidden{
    display:none!important;
}

.page{
    width:min(600px,100%);
    min-height:100vh;
    margin:auto;
    background:#fffaf0;
}


/* ==================================================
   시작
================================================== */

#startScreen{
    display:flex;
    justify-content:center;
    align-items:center;

    background:
        radial-gradient(
            circle at center,
            #fff9eb 0%,
            #f3dfb8 100%
        );
}

.startBox{
    text-align:center;
    padding:40px 25px;
}

.bigPotato{
    font-size:80px;
    animation:
        floatPotato
        2s
        infinite
        ease-in-out;
}

@keyframes floatPotato{

    0%,
    100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-10px);
    }

}

.gameTitle{
    font-size:34px;
    font-weight:900;
    margin:10px 0 25px;
}

.startBtn{
    padding:15px 55px;
    border-radius:18px;
    background:#76502e;
    color:white;
    font-size:20px;
    font-weight:900;
    box-shadow:0 6px 0 #50351f;
}


/* ==================================================
   성장
================================================== */

.growHeader{
    padding:18px;
    text-align:center;
}

.growHeader h1{
    margin:0;
    font-size:25px;
}

.dayText{
    margin-top:5px;
    font-size:14px;
    color:#777;
}

.growArea{
    position:relative;
    height:360px;
    margin:10px 15px;
    overflow:hidden;
    border-radius:25px;

    background:
        linear-gradient(
            #bfe8ff 0 67%,
            #8fc66c 67% 100%
        );

    border:4px solid #725236;
}

.sun,
.petSun{
    position:absolute;
    top:25px;
    right:35px;
    font-size:45px;
    animation:
        sunPulse
        2s
        infinite;
}

@keyframes sunPulse{

    50%{
        transform:scale(1.08);
    }

}

.ground,
.petGround{
    position:absolute;
    bottom:0;
    width:100%;
    height:32%;

    background:
        repeating-linear-gradient(
            0deg,
            #8bc36a,
            #8bc36a 8px,
            #83ba62 8px,
            #83ba62 16px
        );
}

.growPotato{
    position:absolute;
    left:50%;
    bottom:20%;

    transform:
        translateX(-50%);

    width:150px;
    height:180px;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:100px;
    z-index:5;
}

.growPotato.jump{
    animation:
        potatoJump
        .6s
        ease;
}

@keyframes potatoJump{

    0%{
        transform:
            translateX(-50%)
            translateY(0);
    }

    35%{
        transform:
            translateX(-50%)
            translateY(-55px)
            rotate(-8deg);
    }

    70%{
        transform:
            translateX(-50%)
            translateY(-25px)
            rotate(8deg);
    }

    100%{
        transform:
            translateX(-50%)
            translateY(0);
    }

}

.growthInfo{
    padding:0 20px;
}

.growthTop{
    display:flex;
    justify-content:space-between;
    font-weight:800;
    margin-bottom:7px;
}

.progress{
    height:20px;
    background:#e5d9c5;
    border-radius:20px;
    overflow:hidden;
}

.progressBar{
    height:100%;
    width:0%;
    background:#72ad50;
    border-radius:20px;
    transition:width .4s ease;
}

.growActions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    padding:18px;
}

.actionBtn{
    padding:15px 8px;
    border-radius:15px;
    background:#f0e1c5;
    font-size:15px;
    font-weight:800;
}


/* ==================================================
   키우기
================================================== */

.petPage{
    min-height:100vh;
    position:relative;
    background:#fffaf0;
}

.petFixed{
    position:fixed;
    top:0;
    left:50%;

    transform:
        translateX(-50%);

    width:min(600px,100%);

    z-index:999;

    background:#fffaf0;

    box-shadow:
        0 5px 18px
        rgba(80,50,20,.12);
}

.petFixedSpacer{
    height:395px;
}

.petTop{
    padding:8px 18px 4px;
    text-align:center;
}

.petTop h1{
    margin:0;
    font-size:23px;
}

.petDay{
    font-size:13px;
    color:#888;
    margin-top:3px;
}

.petMain{
    padding:0 15px;
}

.petStage{
    position:relative;
    height:285px;

    border-radius:24px;

    background:
        linear-gradient(
            #c7ecff 0 70%,
            #9bc76e 70%
        );

    border:4px solid #725236;

    overflow:hidden;
    touch-action:none;
}

.petGround{
    height:30%;
}

.petImage{
    position:absolute;

    width:165px;
    height:165px;

    left:50%;
    top:46%;

    transform:
        translate(-50%,-50%);

    background-repeat:no-repeat;
    background-position:center;
    background-size:contain;

    image-rendering:pixelated;

    z-index:5;

    touch-action:none;
    pointer-events:auto;
}

.petImage.breathe{
    animation:
        potatoBreathe
        2.2s
        ease-in-out
        infinite;
}

@keyframes potatoBreathe{

    0%,
    100%{
        transform:
            translate(-50%,-50%)
            scale(1);
    }

    50%{
        transform:
            translate(-50%,-52%)
            scale(1.025)
            rotate(-1deg);
    }

}

.petImage.petJump{
    animation:
        petJump
        .65s
        ease;
}

@keyframes petJump{

    0%{
        transform:
            translate(-50%,-50%);
    }

    30%{
        transform:
            translate(-50%,-50%)
            translateY(-55px)
            rotate(-8deg)
            scale(1.03);
    }

    55%{
        transform:
            translate(-50%,-50%)
            translateY(-70px)
            rotate(8deg)
            scale(1.04);
    }

    100%{
        transform:
            translate(-50%,-50%);
    }

}

.petImage.tilt{
    animation:
        potatoTilt
        .55s
        ease;
}

@keyframes potatoTilt{

    0%{
        transform:
            translate(-50%,-50%)
            rotate(0);
    }

    25%{
        transform:
            translate(-50%,-50%)
            rotate(-10deg);
    }

    50%{
        transform:
            translate(-50%,-50%)
            rotate(10deg);
    }

    75%{
        transform:
            translate(-50%,-50%)
            rotate(-5deg);
    }

    100%{
        transform:
            translate(-50%,-50%)
            rotate(0);
    }

}

.petImage.running{
    animation:
        runPotato
        .55s
        infinite
        alternate;
}

@keyframes runPotato{

    from{
        transform:
            translate(-50%,-50%)
            translateY(2px)
            rotate(-3deg);
    }

    to{
        transform:
            translate(-50%,-50%)
            translateY(-3px)
            rotate(3deg);
    }

}

.petEmotion{
    position:absolute;

    z-index:30;

    left:50%;
    top:30%;

    font-size:30px;

    pointer-events:none;

    animation:
        emotionFloat
        1s
        ease-out
        forwards;
}

@keyframes emotionFloat{

    0%{
        opacity:0;

        transform:
            translate(-50%,10px)
            scale(.5);
    }

    20%{
        opacity:1;
    }

    100%{
        opacity:0;

        transform:
            translate(-50%,-45px)
            scale(1.15);
    }

}

.message{
    position:absolute;

    left:50%;
    bottom:12px;

    transform:
        translateX(-50%);

    width:82%;
    min-height:42px;

    background:white;

    border:3px solid #543b26;

    border-radius:18px;

    padding:9px;

    text-align:center;

    font-size:13px;
    font-weight:700;

    z-index:40;
}

.nameBox{
    padding:7px 5px 10px;
    text-align:center;
}

.potatoName{
    font-size:21px;
    font-weight:900;
}

.personality{
    color:#777;
    margin-top:2px;
    font-size:13px;
}

.stats{
    margin:12px 0;
    padding:12px;

    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;

    background:#f2e7d4;

    border-radius:20px;
}

.stat{
    background:white;
    border-radius:15px;

    padding:9px;

    display:flex;
    align-items:center;

    gap:8px;
}

.statCircle{
    width:42px;
    height:42px;

    border-radius:50%;

    background:#eee4d2;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:19px;

    flex-shrink:0;
}

.statText{
    font-size:12px;
    font-weight:800;
}

.statValue{
    font-size:11px;
    color:#777;
}

.petActions{
    padding:4px 0 30px;

    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.petAction{
    padding:14px 5px;

    border-radius:15px;

    background:#ead8ba;

    font-size:14px;
    font-weight:900;
}


/* ==================================================
   감자사전
================================================== */

.dictionary{
    min-height:100vh;
    background:#fffaf0;
}

.dictionaryHeader{
    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:15px;

    border-bottom:2px solid #e5d7c0;

    background:#fffaf0;
}

.dictionaryHeader h1{
    margin:0;
    font-size:20px;
}

.backBtn{
    padding:7px 11px;

    border-radius:10px;

    background:#e5d5b8;

    font-weight:800;
}

.tama{
    margin:18px auto;

    width:min(92vw,500px);

    aspect-ratio:1/1;

    position:relative;

    overflow:hidden;

    border:12px solid #473d35;

    border-radius:12px;

    background:#9aaf72;

    touch-action:none;

    isolation:isolate;
}

.pixelWall{
    position:absolute;
    inset:0;

    background-color:#c8a47b;

    background-image:
        repeating-linear-gradient(
            0deg,
            transparent 0,
            transparent 11px,
            #b99268 11px,
            #b99268 13px
        ),
        repeating-linear-gradient(
            90deg,
            transparent 0,
            transparent 23px,
            rgba(150,110,70,.28) 23px,
            rgba(150,110,70,.28) 25px
        );

    z-index:1;
}

.pixelFloor{
    position:absolute;

    bottom:0;

    width:100%;
    height:31%;

    background-color:#b17d4e;

    background-image:
        repeating-linear-gradient(
            0deg,
            transparent 0,
            transparent 11px,
            #9d6e45 11px,
            #9d6e45 13px
        ),
        repeating-linear-gradient(
            90deg,
            transparent 0,
            transparent 15px,
            rgba(115,75,42,.42) 15px,
            rgba(115,75,42,.42) 18px
        );

    z-index:3;
}

.window{
    position:absolute;

    top:28px;
    left:25px;

    width:100px;
    height:75px;

    background:#9edcf1;

    border:8px solid #6e4c36;

    z-index:5;
}

.window:before{
    content:"";

    position:absolute;

    left:50%;
    top:0;

    width:5px;
    height:100%;

    background:#6e4c36;
}

.window:after{
    content:"";

    position:absolute;

    left:0;
    top:50%;

    width:100%;
    height:5px;

    background:#6e4c36;
}

.sofa{
    position:absolute;

    bottom:65px;
    right:20px;

    width:130px;
    height:55px;

    background:#865d4c;

    border:7px solid #654535;

    z-index:8;
}

.sofa:before{
    content:"";

    position:absolute;

    left:8px;
    right:8px;
    top:-18px;

    height:20px;

    background:#865d4c;

    border:7px solid #654535;
}

.tv{
    position:absolute;

    top:25px;
    right:22px;

    width:75px;
    height:55px;

    background:#2e302e;

    border:7px solid #4b4035;

    z-index:7;
}

.tvScreen{
    position:absolute;
    inset:7px;

    background:#71a3a2;
}


/* ==================================================
   다마고치
================================================== */

.tamaPotato{
    position:absolute;

    width:65px;
    height:65px;

    z-index:20;

    transform:
        translate(-50%,-50%);

    background-repeat:no-repeat;
    background-position:center;
    background-size:contain;

    image-rendering:pixelated;

    touch-action:none;

    cursor:grab;
}

.tamaPotato.walking{
    animation:
        tamaWalk
        .55s
        infinite
        alternate;
}

@keyframes tamaWalk{

    from{
        margin-top:2px;

        transform:
            translate(-50%,-50%)
            rotate(-2deg);
    }

    to{
        margin-top:-2px;

        transform:
            translate(-50%,-50%)
            rotate(2deg);
    }

}

.tamaPotato.selected{
    filter:
        drop-shadow(
            0 0 7px white
        );
}

.tamaPotato.leaderHeld{
    filter:
        drop-shadow(
            0 0 10px #ffd84d
        );
}

.tamaPotato.reactionJump{
    animation:
        tamaReactionJump
        .6s
        ease;
}

@keyframes tamaReactionJump{

    0%{
        transform:
            translate(-50%,-50%);
    }

    35%{
        transform:
            translate(-50%,-50%)
            translateY(-18px)
            rotate(-10deg);
    }

    65%{
        transform:
            translate(-50%,-50%)
            translateY(-10px)
            rotate(10deg);
    }

    100%{
        transform:
            translate(-50%,-50%);
    }

}

.tamaPotato.reactionTilt{
    animation:
        tamaTilt
        .65s
        ease;
}

@keyframes tamaTilt{

    0%{
        transform:
            translate(-50%,-50%)
            rotate(0);
    }

    25%{
        transform:
            translate(-50%,-50%)
            rotate(-12deg);
    }

    50%{
        transform:
            translate(-50%,-50%)
            rotate(12deg);
    }

    75%{
        transform:
            translate(-50%,-50%)
            rotate(-5deg);
    }

    100%{
        transform:
            translate(-50%,-50%)
            rotate(0);
    }

}

.tamaPotato.stunned{
    filter:
        grayscale(1)
        brightness(.7);

    animation:
        stunShake
        .25s
        infinite
        alternate;
}

@keyframes stunShake{

    from{
        margin-left:-3px;
    }

    to{
        margin-left:3px;
    }

}

.tamaSpeech{
    position:absolute;

    z-index:70;

    background:white;

    border:2px solid #332a22;

    border-radius:10px;

    padding:3px 6px;

    font-size:10px;
    font-weight:900;

    white-space:nowrap;

    pointer-events:none;

    animation:
        speech
        1.5s
        ease
        forwards;
}

@keyframes speech{

    0%{
        opacity:0;

        transform:
            translate(-50%,8px)
            scale(.8);
    }

    20%{
        opacity:1;

        transform:
            translate(-50%,0)
            scale(1);
    }

    80%{
        opacity:1;
    }

    100%{
        opacity:0;

        transform:
            translate(-50%,-15px);
    }

}

.tamaEmotion{
    position:absolute;

    z-index:80;

    font-size:22px;

    pointer-events:none;

    animation:
        tamaEmotionFloat
        1s
        ease-out
        forwards;
}

@keyframes tamaEmotionFloat{

    0%{
        opacity:0;

        transform:
            translate(-50%,10px)
            scale(.5);
    }

    20%{
        opacity:1;
    }

    100%{
        opacity:0;

        transform:
            translate(-50%,-30px)
            scale(1.1);
    }

}

.snack{
    position:absolute;

    z-index:100;

    font-size:28px;

    pointer-events:none;

    transform:
        translate(-50%,-50%);
}

.sleepOverlay{
    position:absolute;

    inset:0;

    background:
        rgba(25,30,55,.58);

    z-index:150;

    display:flex;
    align-items:center;
    justify-content:center;

    color:white;

    font-size:22px;
    font-weight:900;

    pointer-events:none;
}


/* ==================================================
   보리
================================================== */

#boriCat{
    position:absolute;

    font-size:30px;

    line-height:1;

    z-index:35;

    pointer-events:none;

    transition:
        left 2.2s linear,
        top 2.2s linear;

    filter:
        drop-shadow(
            1px 2px 1px
            rgba(0,0,0,.2)
        );
}


/* ==================================================
   다마고치 버튼
================================================== */

.tamaControls{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:8px;

    padding:0 15px;
}

.tamaControl{
    padding:13px 4px;

    border-radius:14px;

    background:#e4d0ad;

    font-size:13px;
    font-weight:900;
}


/* ==================================================
   도감
================================================== */

.discovery{
    margin:20px 15px;

    padding:16px;

    border-radius:18px;

    background:#f0e3cd;
}

.discoveryTitle{
    font-weight:900;
    font-size:19px;
}

.discoverySub{
    font-size:13px;

    color:#777;

    margin:4px 0 15px;
}

.potatoList{
    display:flex;

    flex-direction:column;

    gap:8px;
}

.bookItem{
    background:white;

    border-radius:14px;

    padding:8px;

    display:flex;

    align-items:center;

    gap:10px;

    min-height:65px;
}

.bookImage{
    width:50px;
    height:50px;

    flex-shrink:0;

    background-repeat:no-repeat;
    background-position:center;
    background-size:contain;

    image-rendering:pixelated;
}

.bookItemName{
    flex:1;

    text-align:left;

    font-size:13px;
    font-weight:900;
}

.bookStatus{
    font-size:10px;

    color:#999;

    margin-top:3px;
}

.potatoToggle{
    width:52px;
    height:29px;

    border-radius:20px;

    background:#aaa;

    position:relative;

    flex-shrink:0;
}

.potatoToggle.on{
    background:#6ca04c;
}

.potatoToggle:after{
    content:"";

    position:absolute;

    top:4px;
    left:4px;

    width:21px;
    height:21px;

    background:white;

    border-radius:50%;

    transition:left .2s;
}

.potatoToggle.on:after{
    left:27px;
}

.switchInfo{
    margin-top:14px;

    padding-top:12px;

    border-top:2px solid #dfceb1;

    font-size:11px;

    color:#777;

    text-align:center;
}


@media(max-width:420px){

    .petFixedSpacer{
        height:375px;
    }

    .petStage{
        height:275px;
    }

    .petImage{
        width:150px;
        height:150px;
    }

    .tamaPotato{
        width:58px;
        height:58px;
    }

}

</style>

</head>


<body>

<div id="app">


<!-- ==================================================
     시작
================================================== -->

<section
    id="startScreen"
    class="screen"
>

    <div class="startBox">

        <div class="bigPotato">
            🥔
        </div>

        <div class="gameTitle">
            감자키우기
        </div>

        <button
            class="startBtn"
            id="startBtn"
        >
            시작
        </button>

    </div>

</section>


<!-- ==================================================
     성장 화면
================================================== -->

<section
    id="growScreen"
    class="screen hidden"
>

<div class="page">

    <div class="growHeader">

        <h1>
            🥔 감자키우기
        </h1>

        <div
            class="dayText"
            id="growDay"
        >
            1일차
        </div>

    </div>


    <div class="growArea">

        <div class="sun">
            ☀️
        </div>

        <div class="ground"></div>

        <div
            id="growPotato"
            class="growPotato"
        >
            🌱
        </div>

    </div>


    <div class="growthInfo">

        <div class="growthTop">

            <span id="stageText">
                싹
            </span>

            <span id="growthText">
                0 / 100%
            </span>

        </div>

        <div class="progress">

            <div
                id="growthBar"
                class="progressBar"
            ></div>

        </div>

    </div>


    <div class="growActions">

        <button
            class="actionBtn"
            onclick="growAction('fertilizer')"
        >
            🌱 비료 주기
        </button>

        <button
            class="actionBtn"
            onclick="growAction('water')"
        >
            💧 물 주기
        </button>

        <button
            class="actionBtn"
            onclick="growAction('sun')"

/* ==================================================

================================================== */

function random(array){

    if(
        !array||
        !array.length
    ){
        return "";
    }

    return array[
        Math.floor(
            Math.random()*
            array.length
        )
    ];
}


function randomRange(
    min,
    max
){

    return min+
        Math.random()*
        (max-min);
}


function clamp(value){

    return Math.max(
        0,
        Math.min(
            100,
            value
        )
    );
}


/* ==================================================
   화면 전환
================================================== */

function showScreen(
    screen
){

    [
        startScreen,
        growScreen,
        petScreen,
        dictionaryScreen
    ].forEach(
        s=>
            s.classList.add(
                "hidden"
            )
    );

    screen.classList.remove(
        "hidden"
    );

    window.scrollTo(
        0,
        0
    );


    if(
        screen===
        dictionaryScreen
    ){

        renderTama();

        startTamaLoop();

    }else{

        stopTamaLoop();

    }

}

            game.day=1;

            game.potato=null;

            game.stats={
                hunger:0,
                water:0,
                love:0,
                energy:0
            };

            updateGrow();

            showScreen(
                growScreen
            );

        }
    );


/* ==================================================
   성장
================================================== */

let creatingPotato=false;


function growAction(
    type
){

    if(
        creatingPotato
    ){
        return;
    }


    let amount=7;


    if(
        type==="fertilizer"
    ){
        amount=12;
    }


    if(
        type==="water"
    ){
        amount=8;
    }


    if(
        type==="sun"
    ){
        amount=9;
    }


    if(
        type==="cheer"
    ){
        amount=6;
    }


    game.growth=
        clamp(
            game.growth+
            amount
        );


    game.stage=
        Math.min(
            3,
            Math.floor(
                game.growth/25
            )
        );


    growPotato
        .classList
        .remove(
            "jump"
        );


    void growPotato.offsetWidth;


    growPotato
        .classList
        .add(
            "jump"
        );


    updateGrow();


    if(
        game.growth>=100 &&
        !creatingPotato
    ){

        creatingPotato=true;


        setTimeout(
            ()=>{

                createRandomPotato();

                creatingPotato=false;

            },
            650
        );

    }

}


function updateGrow(){

    growthBar.style.width=
        game.growth+
        "%";


    growthText.textContent=
        game.growth+
        " / 100%";


    stageText.textContent=
        STAGES[
            game.stage
        ];


    growPotato.textContent=
        STAGE_EMOJIS[
            game.stage
        ];


    document.getElementById(
        "growDay"
    ).textContent=
        game.day+
        "일차";

}

   감자 탄생
================================================== */

    game.potato=
        random(
            POTATOES
        );


    if(
        !game.discovered.includes(
            game.potato.name
        )
    ){

        game.discovered.push(
            game.potato.name
        );

    }


    game.tamaEnabled[
        game.potato.name
    ]=true;


    game.stats={
        hunger:50,
        water:50,
        love:50,
        energy:100
    };


    updatePet();


    showScreen(
        petScreen
    );


    showEmotion(
        emotionEmoji(
            game.potato

let petTouchStart=0;

    e=>{

        e.preventDefault();


        petTouchStart=

        petTouchStartX=

        petTouchStartY=

        petTouchMoved=false;

    },

    }
);


petImage.addEventListener(

    e=>{

        e.preventDefault();


        const dx=
            e.clientX-

            petTouchStartY;


        if(
            Math.hypot(
                dx,
                dy

        ){

            petTouchMoved=true;

        }

    },
    {
        passive:false
    }
);


petImage.addEventListener(
    "pointerup",
    e=>{

        e.preventDefault();


        const elapsed=
            performance.now()-
            petTouchStart;


        if(
            !petTouchMoved &&
            elapsed<800
        ){

            touchPet();

        }

    },
    {
        passive:false
    }
);

/* ==================================================
   산책
================================================== */

let petWalkFrame=null;

let petWalkStart=0;

let petWalkX=50;

let petWalkDirection=1;


function runPet(){

    if(
        petWalkFrame
    ){

        cancelAnimationFrame(
            petWalkFrame
        );

    }


    petImage.classList.add(
        "running"
    );


    petWalkStart=
        performance.now();


    petWalkX=50;


    petWalkDirection=
        Math.random()<.5
        ? -1
        : 1;


    function walkFrame(
        now
    ){

        const elapsed=
            now-
            petWalkStart;


        if(
            elapsed>=3000
        ){

            petImage.classList.remove(
                "running"
            );


            petImage.style.left=
                "50%";


            petWalkFrame=null;


            return;

        }


        petWalkX+=
            petWalkDirection*
            .08;


        if(
            petWalkX>=78
        ){

            petWalkX=78;

            petWalkDirection=-1;

        }


        if(
            petWalkX<=22
        ){

            petWalkX=22;

            petWalkDirection=1;

        }


        petImage.style.left=
            petWalkX+
            "%";


        petWalkFrame=
            requestAnimationFrame(
                walkFrame
            );

    }


    petWalkFrame=
        requestAnimationFrame(
            walkFrame
        );

}

function renderTama(){

    removeBori();


    const tama=
        document.getElementById(
            "tama"
        );


    tama.querySelectorAll(
        ".tamaPotato,"+
        ".tamaSpeech,"+
        ".tamaEmotion,"+
        ".snack,"+
        ".sleepOverlay"
    ).forEach(
        el=>
            el.remove()
    );


    game.tamaPotatoes=[];

    game.tamaSnacks=[];


    const selected=
        game.discovered.filter(
            name=>
                game.tamaEnabled[name]!==false
        );


    selected.forEach(
        (
            name,
            index
        )=>{

            const p=
                POTATOES.find(
                    x=>
                        x.name===name
                );


            if(
                !p
            ){
                return;
            }


            const angle=
                (
                    Math.PI*2/
                    Math.max(
                        selected.length,
                        1
                    )
                )*
                index;


            const radius=
                Math.min(
                    20,
                    8+
                    selected.length*2
                );


            const obj={

                id:
                    "tama_"+
                    Date.now()+
                    "_"+
                    index,

                data:p,

                x:
                    50+
                    Math.cos(angle)*
                    radius,

                y:
                    72+
                    Math.sin(angle)*
                    10,

                vx:0,

                vy:0,

                targetX:null,

                targetY:null,

                maxSpeed:
                    .45+
                    Math.random()*.3,

                dragging:false,

                sleeping:false,

                stunnedUntil:0,

                nextDecision:
                    performance.now()+
                    Math.random()*2000,

                nextSpeech:
                    performance.now()+
                    5000+
                    Math.random()*7000,

                speechEl:null,

                lastDialogue:""

            };


            game.tamaPotatoes.push(
                obj
            );


            createTamaPotato(
                obj
            );


            chooseTarget(
                obj
            );

        }
    );


    /*
       그룹 대화 다음 실행 시간
    */

    game.nextGroupDialogue=
        performance.now()+
        9000+
        Math.random()*7000;

}

/* ==================================================
   다마고치 좌표
================================================== */

function clampTamaX(
    x
){

    return Math.max(
        5,
        Math.min(
            95,
            x
        )
    );

}


function clampTamaY(
    y
){

    return Math.max(
        8,
        Math.min(
            92,
            y
        )
    );

}


function distance(
    a,
    b
){

    return Math.hypot(
        a.x-b.x,
        a.y-b.y
    );

}


/* ==================================================
   목표 위치
================================================== */

function chooseTarget(
    obj
){

    /*
       독감자는 완전히 독립적으로 이동
    */

    if(
        obj.data.style==="toxic"
    ){

        obj.targetX=
            clampTamaX(
                obj.x+
                random(
                    [-18,18]
                )
            );


        obj.targetY=
            clampTamaY(
                obj.y+
                random(
                    [-18,18]
                )
            );


        return;

    }


    /*
       폭력감자는 독감자를 좋아해서
       독감자 주변으로 이동
    */

    if(
        obj.data.style==="violent"
    ){

        const toxic=
            game.tamaPotatoes.find(
                x=>
                    x.data.style===
                    "toxic"
            );


        if(
            toxic
        ){

            obj.targetX=
                clampTamaX(
                    toxic.x+
                    random(
                        [-8,8]
                    )
                );


            obj.targetY=
                clampTamaY(
                    toxic.y+
                    random(
                        [-6,6]
                    )
                );


            return;

        }

    }


    /*
       저능감자는 더 이상
       대장을 자동으로 따라가지 않음
    */

    if(
        obj.data.style==="dummy"
    ){

        obj.targetX=
            randomRange(
                10,
                90
            );


        obj.targetY=
            randomRange(
                10,
                90
            );


        return;

    }


    /*
       일반 이동
    */

    obj.targetX=
        randomRange(
            8,
            92
        );


    obj.targetY=
        randomRange(
            10,
            90
        );

}

/* ==================================================
   롱프레스
================================================== */

function enableLongPress(
    element,
    obj
){

    let timer=null;

    let dragging=false;

    let moved=false;

    let startX=0;

    let startY=0;


    element.addEventListener(
        "pointerdown",
        e=>{

            e.preventDefault();


            startX=e.clientX;

            startY=e.clientY;


            moved=false;

            dragging=false;


            timer=
                setTimeout(
                    ()=>{

                        dragging=true;

                        obj.dragging=true;


                        element.classList.add(
                            "selected"
                        );


                        if(
                            obj.data.style===
                            "leader"
                        ){

                            game.leaderHeld=
                                true;


                            game.leaderRescueMode=
                                true;


                            element.classList.add(
                                "leaderHeld"
                            );


                            leaderRescue(
                                obj
                            );

                        }

                    },
                    400
                );

        },
        {
            passive:false
        }
    );


    element.addEventListener(
        "pointermove",
        e=>{

            e.preventDefault();


            if(
                Math.hypot(
                    e.clientX-startX,
                    e.clientY-startY
                )>8
            ){

                moved=true;

            }


            if(
                !dragging
            ){

                return;

            }


            const room=
                document.getElementById(
                    "tama"
                );


            const rect=
                room.getBoundingClientRect();


            obj.x=
                clampTamaX(
                    (
                        e.clientX-
                        rect.left
                    )/
                    rect.width*
                    100
                );


            obj.y=
                clampTamaY(
                    (
                        e.clientY-
                        rect.top
                    )/
                    rect.height*
                    100
                );


            obj.vx=0;

            obj.vy=0;


            updateTamaDOM(
                obj
            );


            if(
                obj.data.style===
                "leader"
            ){

                updateFollowers(
                    obj
                );

            }

        },
        {
            passive:false
        }
    );


    function finish(){

        clearTimeout(
            timer
        );


        if(
            dragging
        ){

            dragging=false;

            obj.dragging=false;


            element.classList.remove(
                "selected"
            );


            if(
                obj.data.style===
                "leader"
            ){

                game.leaderHeld=false;

                game.leaderRescueMode=false;


                element.classList.remove(
                    "leaderHeld"
                );

            }


            tamaReaction(
                obj
            );

        }else if(
            !moved
        ){

            tamaReaction(
                obj
            );

        }

    }


    element.addEventListener(
        "pointerup",
        finish
    );


    element.addEventListener(
        "pointercancel",
        finish
    );

}


/* ==================================================
   대장 추종
================================================== */

function updateFollowers(
    leader
){

    game.tamaPotatoes.forEach(
        obj=>{

            if(
                obj===leader||
                obj.dragging||
                obj.sleeping||
                obj.data.style==="toxic"
            ){

                return;

            }


            const index=
                game.tamaPotatoes.indexOf(
                    obj
                );


            const offsets=[
                [-12,4],
                [12,4],
                [-8,11],
                [8,11],
                [-17,10],
                [17,10]
            ];


            const offset=
                offsets[
                    index%
                    offsets.length
                ];


            obj.targetX=
                clampTamaX(
                    leader.x+
                    offset[0]
                );


            obj.targetY=
                clampTamaY(
                    leader.y+
                    offset[1]
                );

        }
    );

}


/* ==================================================
   대장 구출
================================================== */

function leaderRescue(
    leader
){

    game.dialogueLock=true;


    game.dialogueUntil=
        performance.now()+
        1600;


    game.tamaPotatoes
        .filter(
            obj=>
                obj!==leader &&
                !obj.sleeping
        )
        .forEach(
            (
                obj,
                index
            )=>{

                obj.targetX=
                    clampTamaX(
                        leader.x+
                        random(
                            [-12,12]
                        )
                    );


                obj.targetY=
                    clampTamaY(
                        leader.y+
                        random(
                            [-8,8]
                        )
                    );


                setTimeout(
                    ()=>{

                        showTamaSpeech(
                            obj,
                            random([

/* ==================================================
   감자 이동
================================================== */

function updateTamaMovement(
    obj,
    delta,
    now
){

    if(
        obj.sleeping||
        obj.dragging||
        game.dialogueLock
    ){

        return;

    }


    if(
        now<
        obj.stunnedUntil
    ){

        return;

    }


    if(
        obj.targetX===null||
        obj.targetY===null
    ){

        chooseTarget(
            obj
        );

    }


    const dx=
        obj.targetX-
        obj.x;


    const dy=
        obj.targetY-
        obj.y;


    const d=
        Math.hypot(
            dx,
            dy
        );


    if(
        d<1.5
    ){

        chooseTarget(
            obj
        );


        return;

    }


    const speed=
        obj.maxSpeed;


    obj.x+=
        dx/d*
        speed*
        Math.min(
            delta/16,
            2
        );


    obj.y+=
        dy/d*
        speed*
        Math.min(
            delta/16,
            2
        );


    obj.x=
        clampTamaX(
            obj.x
        );


    obj.y=
        clampTamaY(
            obj.y
        );


    const el=
        getTamaElement(
            obj
        );


    if(
        el
    ){

        el.classList.add(
            "walking"
        );

    }


    updateTamaDOM(
        obj
    );

}


/* ==================================================
   다마고치 대사
================================================== */

function randomDialogue(
    array,
    obj
){

    if(
        !array||
        !array.length
    ){

        return "";

    }


    let result;


    do{

        result=
            random(
                array
            );

    }while(
        result===
        obj.lastDialogue &&
        array.length>1
    );


    obj.lastDialogue=
        result;


    return result;

}

   혼잣말
================================================== */

function autonomousSpeech(

){

        obj.dragging||

        obj.data.name===

        showBori();

    }

}

/* ==================================================
   그룹 대화 찾기
================================================== */

function findGroupDialogue(
    count
){

    const available=
        game.tamaPotatoes.filter(
            obj=>
                !obj.sleeping &&
                !obj.dragging
        );


    if(
        available.length<count
    ){

        return null;

    }


    let source;


    if(
        count===2
    ){

        source=
            TWO_DIALOGUES;

    }else if(
        count===4
    ){

        source=
            FOUR_DIALOGUES;

    }else if(
        count===5
    ){

        source=
            FIVE_DIALOGUES;

    }else{

        return null;

    }


    /*
       현재 방에 실제로 존재하는
       감자 조합을 찾는다.
    */

    const shuffled=
        [...source];


    shuffled.sort(
        ()=>Math.random()-.5
    );


    for(
        let i=0;
        i<shuffled.length;
        i++
    ){

        const dialogue=
            shuffled[i];


        const selected=
            dialogue.people.map(
                name=>
                    available.find(
                        obj=>
                            obj.data.name===
                            name
                    )
            );


        if(
            selected.every(
                obj=>obj
            )
        ){

            return{
                dialogue,
                selected
            };

        }

    }


    return null;

}


/* ==================================================
   그룹 대화 실행
================================================== */

function playGroupDialogue(
    count
){

    if(
        game.dialogueLock
    ){

        return;

    }


    const group=
        findGroupDialogue(
            count
        );


    if(
        !group
    ){

        return;

    }


    const dialogue=
        group.dialogue;


    const selected=
        group.selected;


    const conversation=
        random(
            dialogue.lines
        );


    game.dialogueLock=true;


    /*
       대화 시간
    */

    game.dialogueUntil=
        performance.now()+
        conversation.length*
        1500+
        800;


    /*
       대화하는 동안 이동 정지
    */

    selected.forEach(
        obj=>{

            obj.targetX=
                obj.x;

            obj.targetY=
                obj.y;

        }
    );


    conversation.forEach(
        (
            text,
            index
        )=>{

            const obj=
                selected[index];


            if(
                !obj
            ){

                return;

            }


            setTimeout(
                ()=>{

                    if(
                        obj.sleeping
                    ){

                        return;

                    }


                    showTamaSpeech(
                        obj,
                        text
                    );


                    showTamaEmotion(
                        obj,
                        random(
                            emotionSet(
                                obj.data
                            )
                        )
                    );

                },
                index*1500
            );

        }
    );


    setTimeout(
        ()=>{

            game.dialogueLock=false;


            selected.forEach(
                obj=>{

                    if(
                        obj.sleeping||
                        obj.dragging
                    ){

                        return;

                    }


                    obj.targetX=null;

                    obj.targetY=null;


                    chooseTarget(
                        obj
                    );

                }
            );

        },
        conversation.length*
        1500+
        900
    );

}

function toxicAttack(
    toxic
){

    game.tamaPotatoes.forEach(
        other=>{

            if(
                other===toxic||
                other.data.style==="violent"
            ){

                return;

            }


            if(
                distance(
                    toxic,
                    other
                )<15 &&
                Math.random()<.10
            ){

                other.stunnedUntil=
                    performance.now()+
                    3000;


                const el=
                    getTamaElement(
                        other
                    );


                if(
                    el
                ){

                    el.classList.add(
                        "stunned"
                    );


                    setTimeout(
                        ()=>{

                            el.classList.remove(
                                "stunned"
                            );

                        },
                        3000
                    );

                }


                showTamaSpeech(
                    other,
                    "어지러워... 😵"
                );

            }

        }
    );

}

/* ==================================================
   간식
================================================== */

function tamaSnack(){

    const tama=
        document.getElementById(
            "tama"
        );


    if(
        !game.tamaPotatoes.length
    ){

        return;

    }


    const foods=[
        "🍬",
        "🍪",
        "🍭",
        "🍫",
        "🍩"
    ];


    for(
        let i=0;
        i<8;
        i++
    ){

        const snack=
            document.createElement(
                "div"
            );


        snack.className=
            "snack";


        snack.textContent=
            random(
                foods
            );


        snack.style.left=
            (
                10+
                Math.random()*80
            )+
            "%";


        snack.style.top=
            "-5%";


        tama.appendChild(
            snack
        );


        const start=
            performance.now();


        function fall(
            now
        ){

            if(
                !snack.parentNode
            ){

                return;

            }


            const elapsed=
                now-start;


            const percent=
                Math.min(
                    elapsed/
                    1800,
                    1
                );


            snack.style.top=
                (
                    -5+
                    percent*78
                )+
                "%";


            if(
                percent<1
            ){

                requestAnimationFrame(
                    fall
                );

            }else{

                setTimeout(
                    ()=>{

                        if(
                            snack.parentNode
                        ){

                            snack.remove();

                        }

                    },
                    2500
                );

            }

        }


        requestAnimationFrame(
            fall
        );

    }


    game.tamaPotatoes.forEach(
        obj=>{

            if(
                obj.sleeping
            ){

                return;

            }


            showTamaSpeech(
                obj,
                randomDialogue(
                    obj.data.tama.snack,
                    obj
                )
            );


            showTamaEmotion(
                obj,
                "🍬"
            );

        }
    );

}


/* ==================================================
   잠자기
================================================== */

function tamaSleep(){

    if(
        game.sleeping||
        !game.tamaPotatoes.length
    ){

        return;

    }


    game.sleeping=true;


    const tama=
        document.getElementById(
            "tama"
        );


    const overlay=
        document.createElement(
            "div"
        );


    overlay.className=
        "sleepOverlay";


    overlay.textContent=
        "🌙 Zzz...";


    tama.appendChild(
        overlay
    );


    game.tamaPotatoes.forEach(
        obj=>{

            obj.sleeping=true;

            obj.vx=0;

            obj.vy=0;


            showTamaSpeech(
                obj,
                randomDialogue(
                    obj.data.tama.sleep,
                    obj
                )
            );

        }
    );


    removeBori();


    setTimeout(
        ()=>{

            if(
                overlay.parentNode
            ){

                overlay.remove();

            }


            game.tamaPotatoes.forEach(
                obj=>{

                    obj.sleeping=false;

                    obj.targetX=null;

                    obj.targetY=null;

                }
            );


            game.sleeping=false;

        },
        10000
    );

}


/* ==================================================
   🐈 보리
================================================== */

let boriTimeout=null;

let boriMoveTimeout=null;


/*
   꾼감자가 현재 다마고치 방에
   있고 잠들지 않았는지 확인
*/

function isKkungInTama(){

    return game.tamaPotatoes.some(
        obj=>
            obj.data &&
            obj.data.name===
            "꾼감자" &&
            !obj.sleeping
    );

}


/*
   보리 완전 제거
*/

function removeBori(){

    const cat=
        document.getElementById(
            "boriCat"
        );


    if(
        cat
    ){

        cat.remove();

    }


    if(
        boriTimeout
    ){

        clearTimeout(
            boriTimeout
        );

        boriTimeout=null;

    }


    if(
        boriMoveTimeout
    ){

        clearTimeout(
            boriMoveTimeout
        );

        boriMoveTimeout=null;

    }

}


/*
   보리 등장
*/

function showBori(){

    if(
        !isKkungInTama()
    ){

        removeBori();

        return;

    }


    const room=
        document.getElementById(
            "tama"
        );


    if(
        !room
    ){

        return;

    }


    if(
        document.getElementById(
            "boriCat"
        )
    ){

        return;

    }


    const cat=
        document.createElement(
            "div"
        );


    cat.id=
        "boriCat";


    cat.textContent=
        "🐈";


    cat.style.left=
        "50px";


    cat.style.top=
        "100px";


    room.appendChild(
        cat
    );


    moveBori();


    boriTimeout=
        setTimeout(
            ()=>{

                removeBori();

            },
            7000+
            Math.random()*5000
        );

}


/*
   보리 이동
*/

function moveBori(){

    const cat=
        document.getElementById(
            "boriCat"
        );


    const room=
        document.getElementById(
            "tama"
        );


    if(
        !cat||
        !room
    ){

        return;

    }


    if(
        !isKkungInTama()
    ){

        removeBori();

        return;

    }


    const maxX=
        Math.max(
            45,
            room.clientWidth-45
        );


    const maxY=
        Math.max(
            45,
            room.clientHeight-80
        );


    const x=
        20+
        Math.random()*
        Math.max(
            20,
            maxX-20
        );


    const y=
        25+
        Math.random()*
        Math.max(
            20,
            maxY-25
        );


    cat.style.left=
        x+
        "px";


    cat.style.top=
        y+
        "px";


    boriMoveTimeout=
        setTimeout(
            moveBori,
            2200+
            Math.random()*2200
        );

}


/* ==================================================
   다마고치 루프
================================================== */

function startTamaLoop(){

    stopTamaLoop();


    game.lastTamaTime=
        performance.now();


    if(
        !game.nextGroupDialogue
    ){

        game.nextGroupDialogue=
            performance.now()+
            9000+
            Math.random()*7000;

    }


    function frame(
        now
    ){

        if(
            dictionaryScreen.classList.contains(
                "hidden"
            )
        ){

            game.tamaAnimationId=
                null;


            return;

        }


        const delta=
            Math.min(
                now-
                game.lastTamaTime,
                40
            );


        game.lastTamaTime=
            now;


        /*
           대화가 끝났는지
        */

        if(
            game.dialogueLock &&
            now>=game.dialogueUntil
        ){

            game.dialogueLock=false;

        }


        /*
           ==================================================
           감자 이동
           ==================================================
        */

        game.tamaPotatoes.forEach(
            obj=>{

                if(
                    now>
                    obj.nextDecision
                ){

                    if(
                        !game.dialogueLock
                    ){

                        chooseTarget(
                            obj
                        );

                    }


                    obj.nextDecision=
                        now+
                        2500+
                        Math.random()*3000;

                }


                updateTamaMovement(
                    obj,
                    delta,
                    now
                );


                /*
                   혼잣말
                */

                if(
                    now>
                    obj.nextSpeech
                ){

                    if(
                        Math.random()<.35
                    ){

                        autonomousSpeech(
                            obj
                        );

                    }


                    obj.nextSpeech=
                        now+
                        7000+
                        Math.random()*8000;

                }


                /*
                   말풍선 위치
                */

                if(
                    obj.speechEl &&
                    obj.speechEl.parentNode
                ){

                    obj.speechEl.style.left=
                        obj.x+
                        "%";


                    obj.speechEl.style.top=
                        (
                            obj.y-11
                        )+
                        "%";

                }

            }
        );


        /*
           ==================================================
           그룹 대화
           ==================================================
        */

        if(
            !game.dialogueLock &&
            now>=game.nextGroupDialogue
        ){

            const total=
                game.tamaPotatoes.filter(
                    obj=>
                        !obj.sleeping
                ).length;


            /*
               사람이 많을수록
               5인 대화를 우선
            */

            if(
                total>=5 &&
                Math.random()<.25
            ){

                playGroupDialogue(5);

            }else if(
                total>=4 &&
                Math.random()<.40
            ){

                playGroupDialogue(4);

            }else if(
                total>=2 &&
                Math.random()<.80
            ){

                playGroupDialogue(2);

            }


            game.nextGroupDialogue=
                now+
                12000+
                Math.random()*12000;

        }


        /*
           ==================================================
           보리 조건
           ==================================================
        */

        if(
            !isKkungInTama()
        ){

            removeBori();

        }


        game.tamaAnimationId=
            requestAnimationFrame(
                frame
            );

    }


    game.tamaAnimationId=
        requestAnimationFrame(
            frame
        );

}


/* ==================================================
   다마고치 루프 종료
================================================== */

function stopTamaLoop(){

    if(
        game.tamaAnimationId
    ){

        cancelAnimationFrame(
            game.tamaAnimationId
        );


        game.tamaAnimationId=
            null;

    }


    removeBori();

}


/* ==================================================
   스탯 자동 감소
================================================== */

setInterval(
    ()=>{

        if(
            !game.potato
        ){

            return;

        }


        game.stats.hunger=
            clamp(
                game.stats.hunger-1
            );


        game.stats.water=
            clamp(
                game.stats.water-1
            );


        game.stats.energy=
            clamp(
                game.stats.energy-1
            );


        updateStats();

        saveGame();

    },
    60000
);


/* ==================================================
   저장
================================================== */

function saveGame(){

    try{

        localStorage.setItem(
            SAVE_KEY,
            JSON.stringify({

                growth:
                    game.growth,

                stage:
                    game.stage,

                day:
                    game.day,

                potatoName:
                    game.potato
                    ? game.potato.name
                    : null,

                stats:
                    game.stats,

                discovered:
                    game.discovered,

                tamaEnabled:
                    game.tamaEnabled

            })
        );

    }catch(e){

        console.log(
            "게임 저장 실패",
            e
        );

    }

}


/* ==================================================
   불러오기
================================================== */

function loadGame(){

    try{

        const saved=
            localStorage.getItem(
                SAVE_KEY
            );


        if(
            !saved
        ){

            updateGrow();

            return;

        }


        const data=
            JSON.parse(
                saved
            );


        game.growth=
            Number(
                data.growth
            )||
            0;


        game.stage=
            Number(
                data.stage
            )||
            0;


        game.day=
            Number(
                data.day
            )||
            1;


        game.stats=
            data.stats||
            {
                hunger:0,
                water:0,
                love:0,
                energy:0
            };


        game.discovered=
            Array.isArray(
                data.discovered
            )
            ? data.discovered
            : [];


        game.tamaEnabled=
            data.tamaEnabled||
            {};


        if(
            data.potatoName
        ){

            game.potato=
                POTATOES.find(
                    p=>
                        p.name===
                        data.potatoName
                )||
                null;

        }else{

            game.potato=null;

        }


        updateGrow();


        if(
            game.potato
        ){

            updatePet();

        }

    }catch(e){

        console.log(
            "저장 데이터 불러오기 실패",
            e
        );

    }

}


/* ==================================================
   초기화
================================================== */

loadGame();


/* ==================================================
   자동 저장
================================================== */

setInterval(
    saveGame,
    3000
);


window.addEventListener(
    "beforeunload",
    saveGame
);


/* ==================================================
   복사/길게 누르기 방지
================================================== */

document.addEventListener(
    "contextmenu",
    e=>{

        if(
            e.target.closest(".tama")||
            e.target.closest(".petStage")
        ){

            e.preventDefault();

        }

    },
    {
        passive:false
    }
);


document.addEventListener(
    "dragstart",
    e=>{

        if(
            e.target.closest(".tama")||
            e.target.closest(".petStage")
        ){

            e.preventDefault();

        }

    },
    {
        passive:false
    }
);


</script>
