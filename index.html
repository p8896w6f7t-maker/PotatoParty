<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>감자 키우기</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#f5ead8;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Apple SD Gothic Neo",
    "Noto Sans KR",
    sans-serif;
  color:#4b3525;
}

button{
  border:0;
  font-family:inherit;
  cursor:pointer;
}

.hidden{
  display:none !important;
}

.screen{
  width:100%;
  max-width:500px;
  min-height:100vh;
  margin:0 auto;
  background:#fffaf2;
  overflow:hidden;
}


/* =========================
   시작 화면
========================= */

#startScreen{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:30px;
  text-align:center;
}

.start-title{
  font-size:42px;
  font-weight:1000;
  margin-bottom:10px;
}

.start-subtitle{
  font-size:15px;
  color:#806b58;
  margin-bottom:30px;
  line-height:1.5;
}

.start-potato{
  font-size:90px;
  margin-bottom:25px;
}

.start-button{
  width:220px;
  padding:17px 20px;
  border-radius:18px;
  background:#d79b55;
  color:white;
  font-size:17px;
  font-weight:900;
  box-shadow:0 5px 0 #b87838;
}

.start-button:active{
  transform:translateY(4px);
  box-shadow:0 1px 0 #b87838;
}


/* =========================
   성장 화면
========================= */

.header{
  padding:20px 20px 12px;
  text-align:center;
}

.header-title{
  font-size:27px;
  font-weight:1000;
}

.header-subtitle{
  margin-top:5px;
  color:#8b7765;
  font-size:12px;
}

.egg-scene{
  position:relative;
  height:360px;
  overflow:hidden;
  background:
    linear-gradient(
      to bottom,
      #bde8ff 0%,
      #dff5ff 62%,
      #9a673e 62%,
      #855431 100%
    );
}

.sun{
  position:absolute;
  top:25px;
  right:35px;
  font-size:48px;
}

.cloud{
  position:absolute;
  font-size:45px;
  opacity:.85;
}

.cloud.one{
  top:40px;
  left:35px;
}

.cloud.two{
  top:105px;
  left:180px;
}

.sprout{
  position:absolute;
  z-index:3;
  left:50%;
  top:62%;
  transform:translate(-50%,-50%);
  width:100px;
  height:100px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:75px;
  filter:drop-shadow(0 5px 3px rgba(0,0,0,.15));
}

.growth-info{
  text-align:center;
  padding:16px 20px 4px;
}

.growth-title{
  font-size:18px;
  font-weight:1000;
  margin-bottom:7px;
}

.growth-percent{
  font-size:13px;
  color:#806b58;
  margin-bottom:8px;
}

.growth-bar{
  width:100%;
  height:14px;
  background:#eadfce;
  border-radius:20px;
  overflow:hidden;
}

.growth-fill{
  height:100%;
  width:0%;
  background:#79b84b;
  border-radius:20px;
  transition:.25s;
}

.growth-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  padding:16px;
}

.growth-button{
  min-height:54px;
  border-radius:15px;
  background:#eadcc6;
  color:#4b3525;
  font-size:14px;
  font-weight:900;
  box-shadow:0 3px 0 #d1bea3;
}

.growth-button:active{
  transform:translateY(3px);
  box-shadow:0 0 0 #d1bea3;
}


/* =========================
   감자 화면
========================= */

.field{
  position:relative;
  height:300px;
  background:
    linear-gradient(
      to bottom,
      #bde8ff 0%,
      #dff5ff 55%,
      #9a673e 55%,
      #855431 100%
    );
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.field-sun{
  position:absolute;
  top:18px;
  right:25px;
  font-size:42px;
}

.field-cloud{
  position:absolute;
  top:35px;
  left:25px;
  font-size:40px;
}

.character{
  width:190px;
  height:190px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  z-index:3;
}

.character img{
  width:180px;
  height:180px;
  object-fit:contain;
  display:block;
}

.walking{
  animation:walk 0.5s infinite alternate;
}

@keyframes walk{
  from{
    transform:translateX(-7px) rotate(-3deg);
  }
  to{
    transform:translateX(7px) rotate(3deg);
  }
}

.walk-icon{
  position:absolute;
  font-size:42px;
  animation:runIcon 1s ease-out forwards;
  pointer-events:none;
  z-index:10;
}

@keyframes runIcon{
  0%{
    opacity:1;
    transform:translateX(-10px) scale(.8);
  }
  100%{
    opacity:0;
    transform:translateX(80px) scale(1.2);
  }
}

.message{
  position:relative;
  z-index:10;
  width:calc(100% - 32px);
  margin:14px 16px 18px;
  padding:14px 16px;
  min-height:56px;
  border-radius:16px;
  background:#fff0c9;
  border:2px solid #ead7ae;
  color:#4b3525;
  text-align:center;
  font-size:14px;
  font-weight:800;
  line-height:1.6;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 2px 5px rgba(0,0,0,.06);
  overflow:visible;
}

.info{
  padding:0 16px;
  position:relative;
  z-index:5;
}

.potato-name{
  text-align:center;
  font-size:25px;
  font-weight:1000;
  margin:4px 0 8px;
  line-height:1.3;
  position:relative;
  z-index:5;
}

.personality{
  text-align:center;
  color:#806b58;
  font-size:13px;
  font-weight:800;
  margin:0 0 18px;
  line-height:1.4;
  position:relative;
  z-index:5;
}

.stat{
  margin-bottom:12px;
  position:relative;
  z-index:5;
}

.stat-line{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:5px;
  font-size:12px;
  font-weight:800;
  line-height:1.4;
}

.stat-bar{
  width:100%;
  height:11px;
  border-radius:20px;
  background:#eadfce;
  overflow:hidden;
}

.stat-fill{
  height:100%;
  width:0%;
  border-radius:20px;
  transition:.25s;
}

.hunger-fill{
  background:#e59b54;
}

.water-fill{
  background:#70bde8;
}

.love-fill{
  background:#e783a5;
}

.energy-fill{
  background:#91bb55;
}

.action-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  padding:20px 16px 24px;
  position:relative;
  z-index:5;
}

.action-button{
  min-height:56px;
  padding:12px 8px;
  border-radius:15px;
  background:#eadcc6;
  color:#4b3525;
  font-size:14px;
  font-weight:900;
  line-height:1.3;
  box-shadow:0 3px 0 #d1bea3;
}

.action-button:active{
  transform:translateY(3px);
  box-shadow:0 0 0 #d1bea3;
}

.action-button.harvest{
  background:#d79b55;
  color:white;
  box-shadow:0 3px 0 #b87838;
}


/* =========================
   도감
========================= */

.collection-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:18px 16px;
  border-bottom:1px solid #eadfce;
}

.collection-title{
  font-size:24px;
  font-weight:1000;
}

.back-button{
  padding:9px 13px;
  border-radius:12px;
  background:#eadcc6;
  color:#4b3525;
  font-weight:900;
}

.collection-count{
  text-align:center;
  padding:16px;
  font-size:14px;
  font-weight:900;
  color:#806b58;
}

.collection-list{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  padding:0 16px 25px;
}

.collection-card{
  min-height:190px;
  padding:15px 10px;
  background:white;
  border:2px solid #eadfce;
  border-radius:18px;
  text-align:center;
}

.collection-card img{
  width:105px;
  height:105px;
  object-fit:contain;
}

.collection-question{
  width:105px;
  height:105px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto;
  border-radius:50%;
  background:#f1eadf;
  font-size:55px;
  color:#b8a794;
}

.collection-name{
  margin-top:7px;
  font-size:15px;
  font-weight:1000;
}

.collection-status{
  margin-top:5px;
  font-size:11px;
  color:#806b58;
}


/* =========================
   모달
========================= */

.modal{
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.45);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
}

.modal-box{
  width:100%;
  max-width:360px;
  background:#fffaf2;
  border-radius:22px;
  padding:25px 20px 20px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.2);
}

.modal-title{
  font-size:22px;
  font-weight:1000;
  margin-bottom:12px;
}

.modal-text{
  font-size:14px;
  line-height:1.6;
  color:#806b58;
  margin-bottom:20px;
}

.modal-button{
  width:100%;
  padding:14px;
  border-radius:14px;
  background:#d79b55;
  color:white;
  font-weight:900;
  font-size:14px;
}


/* =========================
   작은 화면
========================= */

@media(max-width:360px){

  .start-title{
    font-size:36px;
  }

  .start-potato{
    font-size:75px;
  }

  .egg-scene{
    height:330px;
  }

  .field{
    height:280px;
  }

  .character img{
    width:160px;
    height:160px;
  }

  .action-buttons{
    gap:9px;
    padding-left:12px;
    padding-right:12px;
  }

  .action-button{
    font-size:13px;
  }
}
</style>
</head>

<body>


<!-- =========================
     시작 화면
========================= -->

<section id="startScreen" class="screen">

  <div class="start-potato">🥔</div>

  <div class="start-title">
    감자 키우기
  </div>

  <div class="start-subtitle">
    나만의 감자를 키워보세요!
  </div>

  <button class="start-button" onclick="startGame()">
    게임 시작
  </button>

</section>


<!-- =========================
     성장 화면
========================= -->

<section id="beforeScreen" class="screen hidden">

  <div class="header">
    <div class="header-title">
      감자 키우기
    </div>

    <div class="header-subtitle">
      새싹을 잘 키워보세요
    </div>
  </div>


  <div class="egg-scene">

    <div class="sun">☀️</div>

    <div class="cloud one">☁️</div>
    <div class="cloud two">☁️</div>

    <div id="sprout" class="sprout">
      🌱
    </div>

  </div>


  <div class="growth-info">

    <div class="growth-title">
      새싹 성장 중
    </div>

    <div id="growthPercent" class="growth-percent">
      0%
    </div>

    <div class="growth-bar">
      <div id="growthFill" class="growth-fill"></div>
    </div>

  </div>


  <div id="beforeMessage" class="message">
    새싹을 잘 키워주세요!
  </div>


  <div class="growth-buttons">

    <button class="growth-button" onclick="fertilize()">
      🌱 비료 주기
    </button>

    <button class="growth-button" onclick="waterSprout()">
      💧 물 주기
    </button>

    <button class="growth-button" onclick="sunSprout()">
      ☀️ 햇빛 주기
    </button>

    <button class="growth-button" onclick="cheer()">
      📣 응원하기
    </button>

  </div>

</section>


<!-- =========================
     감자 화면
========================= -->

<section id="gameScreen" class="screen hidden">

  <div class="header">

    <div class="header-title">
      감자 키우기
    </div>

    <div class="header-subtitle">
      감자와 함께 생활해보세요
    </div>

  </div>


  <div class="field">

    <div class="field-sun">
      ☀️
    </div>

    <div class="field-cloud">
      ☁️
    </div>

    <div id="character" class="character"></div>

  </div>


  <div id="message" class="message">
    감자가 태어났어요!
  </div>


  <div class="info">

    <div id="potatoName" class="potato-name">
      감자
    </div>

    <div id="personality" class="personality">
      성격
    </div>


    <div class="stat">

      <div class="stat-line">
        <span>🍖 배고픔</span>
        <span id="hungerText">100 / 100</span>
      </div>

      <div class="stat-bar">
        <div id="hungerFill" class="stat-fill hunger-fill"></div>
      </div>

    </div>


    <div class="stat">

      <div class="stat-line">
        <span>💧 수분</span>
        <span id="waterText">100 / 100</span>
      </div>

      <div class="stat-bar">
        <div id="waterFill" class="stat-fill water-fill"></div>
      </div>

    </div>


    <div class="stat">

      <div class="stat-line">
        <span>❤️ 애정</span>
        <span id="loveText">50 / 100</span>
      </div>

      <div class="stat-bar">
        <div id="loveFill" class="stat-fill love-fill"></div>
      </div>

    </div>


    <div class="stat">

      <div class="stat-line">
        <span>⚡ 체력</span>
        <span id="energyText">100 / 100</span>
      </div>

      <div class="stat-bar">
        <div id="energyFill" class="stat-fill energy-fill"></div>
      </div>

    </div>

  </div>


  <div class="action-buttons">

    <button class="action-button" onclick="feed()">
      🍖 먹이 주기
    </button>

    <button class="action-button" onclick="giveWater()">
      💧 물 주기
    </button>

    <button class="action-button" onclick="pet()">
      ❤️ 쓰다듬기
    </button>

    <button class="action-button" onclick="walk()">
      🏃 산책하기
    </button>

    <button class="action-button harvest" onclick="harvest()">
      🥔 수확하기
    </button>

    <button class="action-button" onclick="showCollection()">
      📖 도감 보기
    </button>

  </div>

</section>


<!-- =========================
     도감 화면
========================= -->

<section id="collectionScreen" class="screen hidden">

  <div class="collection-header">

    <button class="back-button" onclick="closeCollection()">
      ← 돌아가기
    </button>

    <div class="collection-title">
      감자 도감
    </div>

    <div style="width:70px;"></div>

  </div>


  <div id="collectionCount" class="collection-count">
    발견한 감자 0 / 5
  </div>


  <div id="collectionList" class="collection-list"></div>

</section>


<!-- =========================
     모달
========================= -->

<div id="modal" class="modal hidden">

  <div class="modal-box">

    <div id="modalTitle" class="modal-title">
      🥔 새로운 감자 발견!
    </div>

    <div id="modalText" class="modal-text">
      새로운 감자를 발견했어요!
    </div>

    <button class="modal-button" onclick="closeModal()">
      확인
    </button>

  </div>

</div>


<script>

/* =========================
   감자 데이터
========================= */

const potatoes = [

  {
    name:"꾼감자",
    image:"Potato1.PNG"
  },

  {
    name:"대장감자",
    image:"Potato2.PNG"
  },

  {
    name:"독감자",
    image:"Potato3.PNG"
  },

  {
    name:"폭력감자",
    image:"Potato4.PNG"
  },

  {
    name:"저능감자",
    image:"Potato5.PNG"
  }

];


const personalities = [
  "애교쟁이",
  "느긋한",
  "장난꾸러기",
  "호기심 많은",
  "겁이 많은"
];


const STORAGE_KEY = "POTATO_GAME_FINAL_V3";


/* =========================
   상태
========================= */

let state = {

  started:false,

  born:false,

  growth:0,

  character:null,

  personality:null,

  hunger:100,

  water:100,

  love:50,

  energy:100,

  collection:[]

};


/* =========================
   저장 / 불러오기
========================= */

function save(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(state)
  );

}


function load(){

  const saved =
    localStorage.getItem(STORAGE_KEY);

  if(saved){

    try{

      state = JSON.parse(saved);

    }catch(e){

      console.log("저장 데이터 오류");

    }

  }

}


/* =========================
   화면 전환
========================= */

function hideAllScreens(){

  document
    .querySelectorAll(".screen")
    .forEach(screen => {
      screen.classList.add("hidden");
    });

}


function startGame(){

  state.started = true;

  showBeforeScreen();

  save();

}


function showBeforeScreen(){

  hideAllScreens();

  document
    .getElementById("beforeScreen")
    .classList.remove("hidden");

  updateGrowth();

}


function showGameScreen(){

  hideAllScreens();

  document
    .getElementById("gameScreen")
    .classList.remove("hidden");

  updateCharacter();

  updateStats();

}


function showStartScreen(){

  hideAllScreens();

  document
    .getElementById("startScreen")
    .classList.remove("hidden");

}


/* =========================
   새싹 성장
========================= */

function increaseGrowth(amount, text){

  if(state.born) return;

  state.growth += amount;

  if(state.growth > 100){
    state.growth = 100;
  }

  document
    .getElementById("beforeMessage")
    .innerText = text;

  updateGrowth();

  save();

  if(state.growth >= 100){

    setTimeout(() => {

      hatchPotato();

    }, 400);

  }

}


function fertilize(){

  increaseGrowth(
    12,
    "🌱 비료를 먹고 새싹이 쑥쑥 자랐어요!"
  );

}


function waterSprout(){

  increaseGrowth(
    10,
    "💧 촉촉하게 물을 마셨어요!"
  );

}


function sunSprout(){

  increaseGrowth(
    8,
    "☀️ 햇빛을 받아 기운이 났어요!"
  );

}


function cheer(){

  increaseGrowth(
    5,
    "📣 응원을 듣고 새싹이 힘을 냈어요!"
  );

}


function updateGrowth(){

  const percent = state.growth;

  document
    .getElementById("growthPercent")
    .innerText = percent + "%";

  document
    .getElementById("growthFill")
    .style.width = percent + "%";

  const sprout =
    document.getElementById("sprout");

  if(percent < 30){

    sprout.innerText = "🌱";

  }else if(percent < 60){

    sprout.innerText = "🌿";

  }else if(percent < 90){

    sprout.innerText = "🌳";

  }else{

    sprout.innerText = "🥔";

  }

}


/* =========================
   감자 탄생
========================= */

function hatchPotato(){

  if(state.born) return;

  const character =
    potatoes[
      Math.floor(
        Math.random() * potatoes.length
      )
    ];

  const personality =
    personalities[
      Math.floor(
        Math.random() * personalities.length
      )
    ];


  state.born = true;

  state.character = character;

  state.personality = personality;

  state.hunger = 100;

  state.water = 100;

  state.love = 50;

  state.energy = 100;


  save();

  showGameScreen();


  document
    .getElementById("message")
    .innerHTML =
      `🥔 ${character.name}가 태어났어요!<br>
       성격은 <b>${personality}</b>이에요!`;

}


/* =========================
   캐릭터 표시
========================= */

function updateCharacter(){

  const character =
    state.character;

  if(!character) return;

  document
    .getElementById("character")
    .innerHTML =
      `<img src="${character.image}" alt="${character.name}">`;

  document
    .getElementById("potatoName")
    .innerText =
      character.name;

  document
    .getElementById("personality")
    .innerText =
      "성격 · " + state.personality;

}


/* =========================
   스탯
========================= */

function updateStats(){

  updateStat(
    "hunger",
    state.hunger
  );

  updateStat(
    "water",
    state.water
  );

  updateStat(
    "love",
    state.love
  );

  updateStat(
    "energy",
    state.energy
  );

}


function updateStat(name, value){

  value =
    Math.max(
      0,
      Math.min(100, value)
    );

  state[name] = value;

  document
    .getElementById(name + "Text")
    .innerText =
      value + " / 100";

  document
    .getElementById(name + "Fill")
    .style.width =
      value + "%";

}


/* =========================
   성격별 대사
========================= */

const dialogues = {

    feed:"냠냠! 더 먹고 싶어요!",
    water:"꿀꺽꿀꺽! 시원해요!",

    walk:"같이 산책 가요!",
    tired:"조금 피곤해요... 쉬고 싶어요.",
    hungry:"배가 너무 고파요...",
    thirsty:"목이 말라요... 물 주세요!"

  },

  "느긋한":{

    feed:"천천히 먹을게요.",
    water:"음... 시원하네요.",
    pet:"흐음... 편안하네요.",
    walk:"천천히 가요.",
    tired:"조금 쉬었다 갈까요?",
    hungry:"슬슬 배가 고프네요.",
    thirsty:"물을 조금 마시고 싶어요."

  },

  "장난꾸러기":{

    feed:"냠! 내 거 뺏어 먹지 마요!",
    water:"물이다! 퐁당!",
    pet:"간지러워요!ㅋㅋ",
    walk:"누가 더 빨리 가나 달리기!",
    tired:"헥헥... 내가 졌다...",
    hungry:"배고픈 척하는 중이에요!",

  },

  "호기심 많은":{

    feed:"이건 무슨 맛이에요?",
    water:"물이 왜 이렇게 시원하죠?",
    pet:"오? 이렇게 만지는 거군요!",
    walk:"저쪽에는 뭐가 있을까요?",
    tired:"쉬면 또 새로운 걸 볼 수 있겠죠?",
    hungry:"배고프면 어떻게 되는 걸까요?",
    thirsty:"물은 어디서 오는 걸까요?"

  "겁이 많은":{

    feed:"이거... 먹어도 괜찮아요?",
    water:"천천히 마실게요...",

    walk:"저... 너무 멀리 가진 말아요.",
    tired:"조금 무서워요... 쉬고 싶어요.",

  }

/* =========================
   메시지
========================= */

function showMessage(type){

  const personality =
    state.personality;

  if(
    !dialogues[personality] ||
    !dialogues[personality][type]
  ){

    return;

  }

  document
    .getElementById("message")
    .innerText =
      dialogues[personality][type];

}


/* =========================
   먹이
========================= */

function feed(){

  if(!state.born) return;

  state.hunger =
    Math.min(
      100,
      state.hunger + 25
    );

  state.energy =
    Math.min(
      100,
      state.energy + 5
    );

  showMessage("feed");

  updateStats();

  save();

}


/* =========================
   물
========================= */

function giveWater(){

  if(!state.born) return;

  state.water =
    Math.min(
      100,
      state.water + 30
    );

  showMessage("water");

  updateStats();

  save();

}


/* =========================
   쓰다듬기
========================= */

function pet(){

  if(!state.born) return;

  state.love =
    Math.min(
      100,
      state.love + 12
    );

  state.energy =
    Math.max(
      0,
      state.energy - 2
    );

  showMessage("pet");

  updateStats();

  save();

}


/* =========================
   산책
========================= */

function walk(){

  if(!state.born) return;

  if(state.energy < 15){

    showMessage("tired");

    return;

  }

  state.energy =
    Math.max(
      0,
      state.energy - 15
    );

  state.love =
    Math.min(
      100,
      state.love + 10
    );

  state.hunger =
    Math.max(
      0,
      state.hunger - 8
    );

  state.water =
    Math.max(
      0,
      state.water - 8
    );


  const character =
    document.getElementById("character");

  character.classList.add("walking");


  const icon =
    document.createElement("div");

  icon.className = "walk-icon";

  icon.innerText = "🏃";

  character.appendChild(icon);


  setTimeout(() => {

    character.classList.remove("walking");

    icon.remove();

  },1000);


  showMessage("walk");

  updateStats();

  save();

}


/* =========================
   자동 감소
========================= */

setInterval(() => {

  if(!state.born) return;

  state.hunger =
    Math.max(
      0,
      state.hunger - 2
    );

  state.water =
    Math.max(
      0,
      state.water - 2
    );

  state.energy =
    Math.max(
      0,
      state.energy - 1
    );


  updateStats();

  save();


  if(state.hunger <= 20){

    showMessage("hungry");

  }else if(state.water <= 20){

    showMessage("thirsty");

  }else if(state.energy <= 15){

    showMessage("tired");

  }

},10000);


/* =========================
   수확
========================= */

function harvest(){

  if(!state.born) return;

  const character =
    state.character;

  const isNew =
    !state.collection.includes(
      character.name
    );


  if(isNew){

    state.collection.push(
      character.name
    );

  }


  state.born = false;

  state.growth = 0;

  state.character = null;

  state.personality = null;

  state.hunger = 100;

  state.water = 100;

  state.love = 50;

  state.energy = 100;


  save();

  showBeforeScreen();


  if(isNew){

    setTimeout(() => {

      document
        .getElementById("modalTitle")
        .innerText =
          "🥔 새로운 감자 발견!";

      document
        .getElementById("modalText")
        .innerHTML =
          `<b>${character.name}</b>를 수확했어요!<br>
           도감에 등록되었습니다.`;

      document
        .getElementById("modal")
        .classList.remove("hidden");

    },300);

  }else{

    document
      .getElementById("beforeMessage")
      .innerText =
        `${character.name}는 이미 도감에 등록되어 있어요!`;

  }

}


/* =========================
   도감
========================= */

function showCollection(){

  hideAllScreens();

  document
    .getElementById("collectionScreen")
    .classList.remove("hidden");

  renderCollection();

}


function closeCollection(){

  if(state.born){

    showGameScreen();

  }else if(state.started){

    showBeforeScreen();

  }else{

    showStartScreen();

  }

}


function renderCollection(){

  const list =
    document.getElementById(
      "collectionList"
    );

  list.innerHTML = "";


  const count =
    state.collection.length;


  document
    .getElementById("collectionCount")
    .innerText =
      `발견한 감자 ${count} / ${potatoes.length}`;


  potatoes.forEach(potato => {

    const found =
      state.collection.includes(
        potato.name
      );


    const card =
      document.createElement("div");

    card.className =
      "collection-card";


    if(found){

      card.innerHTML = `

        <img
          src="${potato.image}"
          alt="${potato.name}"
        >

        <div class="collection-name">
          ${potato.name}
        </div>

        <div class="collection-status">
          발견 완료 ✓
        </div>

      `;

    }else{

      card.innerHTML = `

        <div class="collection-question">
          ❓
        </div>

        <div class="collection-name">
          ???
        </div>

        <div class="collection-status">
          아직 발견하지 못했어요
        </div>

      `;

    }


    list.appendChild(card);

  });

}


/* =========================
   모달
========================= */

function closeModal(){

  document
    .getElementById("modal")
    .classList.add("hidden");

}


/* =========================
   시작
========================= */

load();


if(state.started){

  if(state.born){

    showGameScreen();

  }else{

    showBeforeScreen();

  }

}else{

  showStartScreen();

}

</script>
