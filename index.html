<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>감자 키우기</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#f5ead7;
  color:#4b3525;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Apple SD Gothic Neo",
    "Noto Sans KR",
    sans-serif;
}

button{
  border:0;
  font-family:inherit;
  cursor:pointer;
  touch-action:manipulation;
}

#app{
  width:100%;
  max-width:500px;
  min-height:100vh;
  margin:0 auto;
  background:#fffaf1;
  overflow:hidden;
}

.screen{
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

.hidden{
  display:none !important;
}


/* =========================
   시작 화면
========================= */

#startScreen{
  align-items:center;
  justify-content:center;
  padding:30px;
  text-align:center;
}

.game-title{
  font-size:42px;
  font-weight:1000;
  margin-bottom:12px;
}

.game-subtitle{
  font-size:15px;
  line-height:1.7;
  color:#806b58;
  margin-bottom:35px;
}

.start-button{
  width:220px;
  padding:17px 20px;
  border-radius:18px;
  background:#8c633f;
  color:white;
  font-size:18px;
  font-weight:900;
  box-shadow:0 5px 0 #65452d;
}

.start-button:active{
  transform:translateY(4px);
  box-shadow:0 1px 0 #65452d;
}


/* =========================
   상단
========================= */

.header{
  padding:18px 18px 12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.header-title{
  font-size:24px;
  font-weight:1000;
}

.back-button{
  padding:9px 13px;
  border-radius:12px;
  background:#eadcc6;
  color:#604a36;
  font-weight:800;
}


/* =========================
   싹 성장 화면
========================= */

.egg-scene{
  position:relative;
  height:360px;
  overflow:hidden;

  background:
    linear-gradient(
      to bottom,
      #bfe5ff 0%,
      #dff3ff 62%,
      #a8794f 62%,
      #8f633f 100%
    );
}

.sun{
  position:absolute;
  top:25px;
  right:30px;
  font-size:48px;
}

.cloud{
  position:absolute;
  top:45px;
  left:30px;
  font-size:42px;
}

.sprout{
  position:absolute;
  z-index:3;

  left:50%;
  top:62%;

  transform:translate(-50%,-50%);

  width:100px;
  height:100px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:75px;

  filter:
    drop-shadow(
      0 5px 3px rgba(0,0,0,.15)
    );
}

.growth-title{
  text-align:center;
  font-size:21px;
  font-weight:1000;
  margin:18px 0 4px;
}

.growth-percent{
  text-align:center;
  font-size:14px;
  color:#806b58;
  margin-bottom:12px;
}

.progress-wrap{
  margin:0 20px 18px;
  height:18px;
  border-radius:20px;
  background:#e5d7c3;
  overflow:hidden;
}

.progress{
  height:100%;
  width:0%;
  border-radius:20px;
  background:#83a95c;
  transition:.3s;
}

.growth-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  padding:0 16px 20px;
}

.growth-button{
  padding:15px 8px;
  border-radius:15px;
  background:#eadcc6;
  color:#4b3525;
  font-size:14px;
  font-weight:900;
}

.growth-button:active{
  transform:scale(.97);
}

#beforeMessage{
  margin-top:0;
  margin-bottom:24px;
}


/* =========================
   메시지
========================= */

.message{
  margin:12px 16px 16px;

  padding:14px 16px;

  min-height:52px;

  border-radius:16px;

  background:#fff0c9;

  border:2px solid #ead7ae;

  color:#4b3525;

  text-align:center;

  font-size:14px;

  font-weight:800;

  line-height:1.5;

  display:flex;
  align-items:center;
  justify-content:center;

  box-shadow:
    0 2px 5px rgba(0,0,0,.06);
}


/* =========================
   감자 밭
========================= */

.field{
  position:relative;

  height:290px;

  overflow:hidden;

  background:
    linear-gradient(
      to bottom,
      #bfe5ff 0%,
      #dff3ff 48%,
      #a8794f 48%,
      #8f633f 100%
    );
}

.field::after{
  content:"";

  position:absolute;

  left:0;
  right:0;
  bottom:0;

  height:55%;

  background:
    radial-gradient(
      circle at 20% 30%,
      rgba(255,255,255,.12) 0 3px,
      transparent 4px
    ),
    radial-gradient(
      circle at 70% 60%,
      rgba(255,255,255,.08) 0 3px,
      transparent 4px
    );

  pointer-events:none;
}

.field-cloud{
  position:absolute;
  top:25px;
  left:25px;
  font-size:38px;
}

.field-sun{
  position:absolute;
  top:18px;
  right:25px;
  font-size:43px;
}

.character{
  position:absolute;

  left:50%;
  bottom:18px;

  transform:translateX(-50%);

  width:210px;
  height:210px;

  display:flex;
  align-items:center;
  justify-content:center;

  z-index:3;

  transition:.25s;
}

.character img{
  max-width:100%;
  max-height:100%;

  object-fit:contain;

  filter:
    drop-shadow(
      0 8px 5px rgba(0,0,0,.2)
    );
}

.character.walking{
  animation:
    walk .7s ease-in-out infinite;
}

@keyframes walk{

  0%{
    transform:
      translateX(-50%)
      translateY(0)
      rotate(-4deg);
  }

  50%{
    transform:
      translateX(-50%)
      translateY(-14px)
      rotate(4deg);
  }

  100%{
    transform:
      translateX(-50%)
      translateY(0)
      rotate(-4deg);
  }

}


/* =========================
   감자 정보
========================= */

.info{
  padding:0 16px;
}

.potato-name{
  text-align:center;
  font-size:25px;
  font-weight:1000;
  margin:4px 0 12px;
}

.personality{
  text-align:center;
  color:#806b58;
  font-size:13px;
  font-weight:800;
  margin-bottom:15px;
}

.stat{
  margin-bottom:9px;
}

.stat-line{
  display:flex;
  justify-content:space-between;
  margin-bottom:4px;
  font-size:12px;
  font-weight:800;
}

.stat-bar{
  height:12px;
  background:#e6dac9;
  border-radius:20px;
  overflow:hidden;
}

.stat-fill{
  height:100%;
  border-radius:20px;
  transition:.3s;
}

.hunger-fill{
  background:#d89b5b;
}

.water-fill{
  background:#72b5d5;
}

.love-fill{
  background:#df8496;
}

.energy-fill{
  background:#8cae66;
}


/* =========================
   행동 버튼
========================= */

.action-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;

  padding:17px 16px 20px;
}

.action-button{
  min-height:54px;

  border-radius:15px;

  background:#eadcc6;

  color:#4b3525;

  font-size:14px;
  font-weight:900;

  box-shadow:
    0 3px 0 #d1bea3;
}

.action-button:active{
  transform:translateY(3px);

  box-shadow:
    0 0 0 #d1bea3;
}

.action-button.harvest{
  background:#8c633f;
  color:white;

  box-shadow:
    0 3px 0 #65452d;
}


/* =========================
   도감
========================= */

.collection-title{
  text-align:center;
  font-size:27px;
  font-weight:1000;
  margin:8px 0 4px;
}

.collection-count{
  text-align:center;
  color:#806b58;
  font-size:14px;
  margin-bottom:18px;
}

.collection-list{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  padding:0 16px 25px;
}

.collection-card{
  min-height:210px;

  padding:14px;

  border-radius:18px;

  background:#fff;

  border:2px solid #eadcc6;

  text-align:center;
}

.collection-card img{
  width:120px;
  height:120px;

  object-fit:contain;
}

.collection-card .unknown{
  width:120px;
  height:120px;

  margin:auto;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:58px;
}

.collection-card-name{
  font-weight:1000;
  margin-top:4px;
}

.collection-card-desc{
  font-size:11px;
  color:#806b58;
  margin-top:5px;
}


/* =========================
   모달
========================= */

.modal-bg{
  position:fixed;

  inset:0;

  background:rgba(0,0,0,.45);

  display:flex;

  align-items:center;
  justify-content:center;

  padding:20px;

  z-index:100;
}

.modal{
  width:100%;
  max-width:360px;

  background:#fffaf1;

  border-radius:22px;

  padding:25px 20px;

  text-align:center;

  box-shadow:
    0 10px 30px rgba(0,0,0,.2);
}

.modal-title{
  font-size:23px;
  font-weight:1000;
  margin-bottom:10px;
}

.modal-text{
  font-size:14px;
  line-height:1.6;
  color:#806b58;
  margin-bottom:20px;
}

.modal-button{
  width:100%;
  padding:14px;

  border-radius:14px;

  background:#8c633f;
  color:white;

  font-size:15px;
  font-weight:900;
}

</style>
</head>


<body>

<div id="app">


<!-- =========================
     시작 화면
========================= -->

<section
  id="startScreen"
  class="screen">

  <div class="game-title">
    🥔 감자 키우기
  </div>

  <div class="game-subtitle">
    작은 싹에서 시작해서<br>
    세상에 하나뿐인 감자를 키워보세요!
  </div>

  <button
    class="start-button"
    onclick="startGame()">

    🌱 감자 키우기 시작

  </button>

</section>



<!-- =========================
     성장 화면
========================= -->

<section
  id="beforeScreen"
  class="screen hidden">

  <div class="header">

    <div class="header-title">
      🌱 감자 키우기
    </div>

  </div>


  <div class="egg-scene">

    <div class="sun">
      ☀️
    </div>

    <div class="cloud">
      ☁️
    </div>

    <div class="sprout">
      🌱
    </div>

  </div>


  <div
    id="beforeMessage"
    class="message">

    작은 싹이 자라고 있어요!

  </div>


  <div class="growth-title">
    감자 성장시키기
  </div>

  <div
    id="growthPercent"
    class="growth-percent">

    성장도 0%

  </div>


  <div class="progress-wrap">

    <div
      id="growthBar"
      class="progress">
    </div>

  </div>


  <div class="growth-buttons">

    <button
      class="growth-button"
      onclick="grow('fertilizer')">

      🧪 비료 주기
      <br>
      +12

    </button>

    <button
      class="growth-button"
      onclick="grow('water')">

      💧 물 주기
      <br>
      +10

    </button>

    <button
      class="growth-button"
      onclick="grow('sunshine')">

      ☀️ 햇빛 쬐기
      <br>
      +8

    </button>

    <button
      class="growth-button"
      onclick="grow('random')">

      ✨ 응원하기
      <br>
      +5

    </button>

  </div>

</section>



<!-- =========================
     감자 화면
========================= -->

<section
  id="gameScreen"
  class="screen hidden">

  <div class="header">

    <div class="header-title">
      🥔 감자 키우기
    </div>

  </div>


  <div class="field">

    <div class="field-cloud">
      ☁️
    </div>

    <div class="field-sun">
      ☀️
    </div>

    <div
      id="character"
      class="character">
    </div>

  </div>


  <!-- 감자 바로 아래 메시지 -->

  <div
    id="message"
    class="message">

    감자가 태어났어요!

  </div>


  <div class="info">

    <div
      id="potatoName"
      class="potato-name">

      감자

    </div>

    <div
      id="personality"
      class="personality">

      성격

    </div>


    <div class="stat">

      <div class="stat-line">

        <span>🍖 배고픔</span>

        <span id="hungerText">100</span>

      </div>

      <div class="stat-bar">

        <div
          id="hungerBar"
          class="stat-fill hunger-fill">
        </div>

      </div>

    </div>


    <div class="stat">

      <div class="stat-line">

        <span>💧 수분</span>

        <span id="waterText">100</span>

      </div>

      <div class="stat-bar">

        <div
          id="waterBar"
          class="stat-fill water-fill">
        </div>

      </div>

    </div>


    <div class="stat">

      <div class="stat-line">

        <span>❤️ 호감도</span>

        <span id="loveText">30</span>

      </div>

      <div class="stat-bar">

        <div
          id="loveBar"
          class="stat-fill love-fill">
        </div>

      </div>

    </div>


    <div class="stat">

      <div class="stat-line">

        <span>⚡ 체력</span>

        <span id="energyText">100</span>

      </div>

      <div class="stat-bar">

        <div
          id="energyBar"
          class="stat-fill energy-fill">
        </div>

      </div>

    </div>

  </div>


  <!--
    다시 키우기 버튼은 제거.
    수확 + 도감만 남김.
  -->

  <div class="action-buttons">

    <button
      class="action-button"
      onclick="feed()">

      🍖 먹이 주기

    </button>

    <button
      class="action-button"
      onclick="giveWater()">

      💧 물 주기

    </button>

    <button
      class="action-button"
      onclick="pet()">

      ❤️ 쓰다듬기

    </button>

    <button
      class="action-button"
      onclick="walk()">

      🏃 산책하기

    </button>

    <button
      class="action-button harvest"
      onclick="harvest()">

      🥔 수확하기

    </button>

    <button
      class="action-button"
      onclick="showCollection()">

      📖 도감 보기

    </button>

  </div>

</section>



<!-- =========================
     도감 화면
========================= -->

<section
  id="collectionScreen"
  class="screen hidden">

  <div class="header">

    <div class="header-title">
      📖 감자 도감
    </div>

    <button
      class="back-button"
      onclick="closeCollection()">

      돌아가기

    </button>

  </div>


  <div class="collection-title">
    감자 도감
  </div>

  <div
    id="collectionCount"
    class="collection-count">

    발견한 감자 0 / 5

  </div>


  <div
    id="collectionList"
    class="collection-list">
  </div>

</section>



<!-- =========================
     모달
========================= -->

<div
  id="modalBg"
  class="modal-bg hidden">

  <div class="modal">

    <div
      id="modalTitle"
      class="modal-title">

      새로운 감자 발견!

    </div>

    <div
      id="modalText"
      class="modal-text">

      새로운 감자를 발견했어요!

    </div>

    <button
      class="modal-button"
      onclick="closeModal()">

      확인

    </button>

  </div>

</div>


</div>



<script>


/* =========================
   감자 데이터
========================= */

const characters = [

  {
    name:"꾼감자",
    image:"Potato1.PNG"
  },

  {
    name:"대장감자",
    image:"Potato2.PNG"
  },

  {
    name:"독감자",
    image:"Potato3.PNG"
  },

  {
    name:"폭력감자",
    image:"Potato4.PNG"
  },

  {
    name:"저능감자",
    image:"Potato5.PNG"
  }

];


const personalities = [

  "애교쟁이",
  "느긋한",
  "장난꾸러기",
  "호기심 많은",
  "겁이 많은"

];


const STORAGE_KEY =
  "POTATO_GAME_FINAL_V3";


/* =========================
   게임 상태
========================= */

let state = {

  started:false,

  born:false,

  growth:0,

  character:null,

  personality:null,

  hunger:100,

  water:100,

  love:30,

  energy:100,

  collection:[]

};


/* =========================
   저장
========================= */

function save(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(state)
  );

}


/* =========================
   불러오기
========================= */

function load(){

  const saved =
    localStorage.getItem(
      STORAGE_KEY
    );

  if(saved){

    try{

      state =
        JSON.parse(saved);

    }

    catch(e){

      console.log(
        "저장 데이터 불러오기 실패"
      );

    }

  }

}


/* =========================
   화면 전환
========================= */

function hideAll(){

  document
    .querySelectorAll(".screen")
    .forEach(screen => {

      screen.classList.add(
        "hidden"
      );

    });

}


function startGame(){

  state.started = true;

  save();

  showBeforeScreen();

}


function showStartScreen(){

  hideAll();

  document
    .getElementById(
      "startScreen"
    )
    .classList.remove(
      "hidden"
    );

}


function showBeforeScreen(){

  hideAll();

  document
    .getElementById(
      "beforeScreen"
    )
    .classList.remove(
      "hidden"
    );

  updateGrowth();

}


function showGameScreen(){

  hideAll();

  document
    .getElementById(
      "gameScreen"
    )
    .classList.remove(
      "hidden"
    );

  updateGame();

}


/* =========================
   성장
========================= */

function grow(type){

  let amount = 5;

  let text = "";


  if(type === "fertilizer"){

    amount = 12;

    text =
      "🧪 비료를 먹고 쑥쑥 자라고 있어요!";

  }

  else if(type === "water"){

    amount = 10;

    text =
      "💧 물을 마시고 촉촉해졌어요!";

  }

  else if(type === "sunshine"){

    amount = 8;

    text =
      "☀️ 햇빛을 받아 힘이 나요!";

  }

  else{

    amount = 5;

    text =
      "✨ 응원을 받고 조금 더 자랐어요!";

  }


  state.growth =
    Math.min(
      100,
      state.growth + amount
    );


  showBeforeMessage(text);

  updateGrowth();

  save();


  if(state.growth >= 100){

    hatchPotato();

  }

}


function showBeforeMessage(text){

  document
    .getElementById(
      "beforeMessage"
    )
    .innerHTML = text;

}


function updateGrowth(){

  const percent =
    Math.round(
      state.growth
    );


  document
    .getElementById(
      "growthPercent"
    )
    .textContent =
      `성장도 ${percent}%`;


  document
    .getElementById(
      "growthBar"
    )
    .style.width =
      `${percent}%`;

}


/* =========================
   감자 탄생
   ※ 여기서는 도감 등록 안 함
========================= */

function hatchPotato(){

  const character =
    characters[
      Math.floor(
        Math.random() *
        characters.length
      )
    ];


  const personality =
    personalities[
      Math.floor(
        Math.random() *
        personalities.length
      )
    ];


  state.born = true;

  state.character =
    character.name;

  state.personality =
    personality;


  state.hunger = 100;
  state.water = 100;
  state.love = 30;
  state.energy = 100;


  save();

  showGameScreen();


  /*
    태어났을 때는 도감에 등록하지 않음.
    수확할 때만 등록됨.
  */

  showMessage(
    "feed"
  );


  document
    .getElementById(
      "message"
    )
    .innerHTML =
      `🥔 ${character.name}가 태어났어요!<br>
       성격은 <b>${personality}</b>이에요.`;

}


/* =========================
   현재 감자 찾기
========================= */

function getCharacter(){

  return characters.find(
    item =>
      item.name ===
      state.character
  );

}


/* =========================
   게임 화면
========================= */

function updateGame(){

  const character =
    getCharacter();


  if(!character){

    return;

  }


  const characterBox =
    document.getElementById(
      "character"
    );


  characterBox.innerHTML = `

    <img
      src="${character.image}"
      alt="${character.name}"
    >

  `;


  document
    .getElementById(
      "potatoName"
    )
    .textContent =
      character.name;


  document
    .getElementById(
      "personality"
    )
    .textContent =
      `성격 : ${state.personality}`;


  updateStat(
    "hunger",
    state.hunger
  );

  updateStat(
    "water",
    state.water
  );

  updateStat(
    "love",
    state.love
  );

  updateStat(
    "energy",
    state.energy
  );

}


function updateStat(
  name,
  value
){

  const number =
    Math.max(
      0,
      Math.min(
        100,
        Math.round(value)
      )
    );


  document
    .getElementById(
      `${name}Text`
    )
    .textContent =
      number;


  document
    .getElementById(
      `${name}Bar`
    )
    .style.width =
      `${number}%`;

}

/* =========================
   대사 출력
========================= */

function getDialogue(
  action
){

  const personality =
    state.personality;


  const list =
    dialogues[
      personality
    ]?.[action];


  if(
    !list ||
    list.length === 0
  ){

    return "🥔 ...";

  }


  return list[
    Math.floor(
      Math.random() *
      list.length
    )
  ];

}


function showMessage(
  action
){

  document
    .getElementById(
      "message"
    )
    .innerHTML =
      getDialogue(action);

}


/* =========================
   먹이
========================= */

function feed(){

  state.hunger =
    Math.min(
      100,
      state.hunger + 25
    );


  state.energy =
    Math.min(
      100,
      state.energy + 3
    );


  state.love =
    Math.min(
      100,
      state.love + 3
    );


  showMessage("feed");

  updateGame();

  save();

}


/* =========================
   물
========================= */

function giveWater(){

  state.water =
    Math.min(
      100,
      state.water + 30
    );


  state.energy =
    Math.min(
      100,
      state.energy + 2
    );


  state.love =
    Math.min(
      100,
      state.love + 2
    );


  showMessage("water");

  updateGame();

  save();

}


/* =========================
   쓰다듬기
========================= */

function pet(){

  state.love =
    Math.min(
      100,
      state.love + 8
    );


  state.energy =
    Math.max(
      0,
      state.energy - 1
    );


  showMessage("pet");

  updateGame();

  save();

}


/* =========================
   산책
========================= */

function walk(){

  if(
    state.energy < 10
  ){

    showMessage("tired");

    return;

  }


  state.energy =
    Math.max(
      0,
      state.energy - 10
    );


  state.love =
    Math.min(
      100,
      state.love + 7
    );


  state.hunger =
    Math.max(
      0,
      state.hunger - 5
    );


  state.water =
    Math.max(
      0,
      state.water - 5
    );


  const characterBox =
    document.getElementById(
      "character"
    );


  characterBox.classList.add(
    "walking"
  );


  showMessage("walk");

  updateGame();

  save();


  setTimeout(
    () => {

      characterBox.classList.remove(
        "walking"
      );

    },
    2100
  );

}


/* =========================
   자동 감소
========================= */

setInterval(
  () => {

    if(
      state.started &&
      state.born
    ){

      state.hunger =
        Math.max(
          0,
          state.hunger - 2
        );


      state.water =
        Math.max(
          0,
          state.water - 2
        );


      state.energy =
        Math.max(
          0,
          state.energy - 1
        );


      if(
        state.hunger <= 20
      ){

        showMessage(
          "hungry"
        );

      }

      else if(
        state.water <= 20
      ){

        showMessage(
          "thirsty"
        );

      }


      updateGame();

      save();

    }

  },
  10000
);


/* =========================
   수확
   ★ 여기에서만 도감 등록
========================= */

function harvest(){

  if(!state.born){

    return;

  }


  const character =
    getCharacter();


  if(!character){

    return;

  }


  /*
    지금까지 수확한 적이 없는
    감자인지 확인
  */

  const isNew =
    !state.collection.includes(
      character.name
    );


  /*
    ★ 수확하는 순간 도감 등록
  */

  if(isNew){

    state.collection.push(
      character.name
    );

  }


  /*
    감자를 수확했으므로
    다시 싹부터 시작
  */

  state.born = false;

  state.growth = 0;

  state.character = null;

  state.personality = null;

  state.hunger = 100;
  state.water = 100;
  state.love = 30;
  state.energy = 100;


  save();

  showBeforeScreen();


  /*
    처음 수확한 감자라면
    발견 모달 표시
  */

  if(isNew){

    showModal(
      "🥔 새로운 감자 발견!",
      `<b>${character.name}</b>를 수확했어요!<br><br>
       도감에 등록되었습니다!<br><br>
       발견한 감자 ${state.collection.length} / ${characters.length}`
    );

  }

  else{

    showBeforeMessage(
      `🥔 ${character.name}를 수확했어요!<br>
       이미 도감에 등록된 감자예요.`
    );

  }

}


/* =========================
   도감
========================= */

function showCollection(){

  hideAll();

  document
    .getElementById(
      "collectionScreen"
    )
    .classList.remove(
      "hidden"
    );


  renderCollection();

}


function closeCollection(){

  if(state.born){

    showGameScreen();

  }

  else if(state.started){

    showBeforeScreen();

  }

  else{

    showStartScreen();

  }

}


function renderCollection(){

  const list =
    document.getElementById(
      "collectionList"
    );


  const count =
    state.collection.length;


  document
    .getElementById(
      "collectionCount"
    )
    .textContent =
      `발견한 감자 ${count} / ${characters.length}`;


  list.innerHTML = "";


  characters.forEach(
    character => {

      const found =
        state.collection.includes(
          character.name
        );


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "collection-card";


      if(found){

        card.innerHTML = `

          <img
            src="${character.image}"
            alt="${character.name}"
          >

          <div
            class="collection-card-name">

            ${character.name}

          </div>

          <div
            class="collection-card-desc">

            발견 완료 ✓

          </div>

        `;

      }

      else{

        card.innerHTML = `

          <div class="unknown">
            ❓
          </div>

          <div
            class="collection-card-name">

            ???

          </div>

          <div
            class="collection-card-desc">

            아직 발견하지 못했어요

          </div>

        `;

      }


      list.appendChild(card);

    }
  );

}


/* =========================
   모달
========================= */

function showModal(
  title,
  text
){

  document
    .getElementById(
      "modalTitle"
    )
    .innerHTML =
      title;


  document
    .getElementById(
      "modalText"
    )
    .innerHTML =
      text;


  document
    .getElementById(
      "modalBg"
    )
    .classList.remove(
      "hidden"
    );

}


function closeModal(){

  document
    .getElementById(
      "modalBg"
    )
    .classList.add(
      "hidden"
    );

}

   시작

load();


if(state.started){

  if(state.born){

    showGameScreen();

  }

  else{

    showBeforeScreen();

  }

}

else{

  showStartScreen();

}
